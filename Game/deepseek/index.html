const ui = {
  hpFill: document.getElementById('hpFill'),
  hpNum: document.getElementById('hpNum'),
  objective: document.getElementById('objective'),
  clock: document.getElementById('clock'),
  cntBottle: document.getElementById('cntBottle'),
  cntTrash: document.getElementById('cntTrash'),
  cntDrink: document.getElementById('cntDrink'),
  slotBottle: document.getElementById('slotBottle'),
  slotTrash: document.getElementById('slotTrash'),
  slotDrink: document.getElementById('slotDrink'),
  prompt: document.getElementById('prompt'),
  search: document.getElementById('search'),
  searchFill: document.getElementById('searchFill'),
  worldUI: document.getElementById('worldUI'),
  overlay: document.getElementById('overlay'),
  hpTrack: document.getElementById('hpTrack')
};

let lastHud = {};

function setText(el, key, val) {
  if (!el) return;
  if (lastHud[key] !== val) {
    lastHud[key] = val;
    el.textContent = val;
  }
}

function project(x, y, z) {
  const v = new THREE.Vector3(x, y, z);
  v.project(camera);
  return {
    x: (v.x * 0.5 + 0.5) * window.innerWidth,
    y: (-v.y * 0.5 + 0.5) * window.innerHeight,
    visible: v.z > -1 && v.z < 1
  };
}

let promptState = '';
function showPrompt(html, x, y, locked = false) {
  if (promptState !== html) {
    ui.prompt.innerHTML = html;
    promptState = html;
  }
  ui.prompt.classList.remove('hidden');
  ui.prompt.classList.toggle('locked', locked);
  const p = project(x, y, 0.6);
  ui.prompt.style.left = p.x + 'px';
  ui.prompt.style.top = p.y + 'px';
}
function hidePrompt() {
  if (!ui.prompt.classList.contains('hidden')) ui.prompt.classList.add('hidden');
  promptState = '';
}

function showSearch(x, y, progress) {
  ui.search.classList.remove('hidden');
  const p = project(x, y, 0.5);
  ui.search.style.left = p.x + 'px';
  ui.search.style.top = p.y + 'px';
  ui.searchFill.style.width = Math.round(progress * 100) + '%';
}
function hideSearch() {
  if (!ui.search.classList.contains('hidden')) ui.search.classList.add('hidden');
}

function floatTextWorld(text, x, y, cls) {
  const p = project(x, y, 0.7);
  const el = document.createElement('div');
  el.className = 'floater ' + cls;
  el.textContent = text;
  el.style.left = p.x + 'px';
  el.style.top = p.y + 'px';
  ui.worldUI.appendChild(el);
  setTimeout(() => el.remove(), 1100);
}

function updateBars() {
  for (const e of game.enemies) {
    const ch = e.ch;
    if (e.dead) { e.bar.visible = false; continue; }
    const dist = Math.abs(player.x - e.x);
    const show = e.active && (e.hpShown > 0 || e.state === 'windup' || e.state === 'attack' || dist < 4.5) && !game.outro;
    e.bar.visible = show;
    if (show) {
      const y = e.y + e.h + 0.72;
      e.bar.position.set(e.x, y, 0.95);
      const frac = clamp(e.health / e.maxHealth, 0, 1);
      e.barFill.scale.x = Math.max(0.001, e.barW * frac);
      e.barFill.position.x = -e.barW / 2 + (e.barW * frac) / 2;
      e.barFill.material.color.setHex(frac > 0.5 ? 0xd8623f : 0xe09a45);
      e.barFill.material.opacity = 0.95;
      e.barBg.material.opacity = 0.75;
    }
    // telegraph
    e.tele.visible = !e.dead && e.active && e.state === 'windup' && e.hurtT <= 0;
    if (e.tele.visible) {
      e.tele.position.y = e.h + 1.18;
      e.tele.scale.setScalar(1 + Math.sin(e.stateT * 20) * 0.12);
    }
  }
}

function updateHUD() {
  const p = player;
  if (!p) return;
  const pct = clamp(p.health / p.maxHealth, 0, 1) * 100;
  ui.hpFill.style.width = pct + '%';
  ui.hpFill.classList.toggle('low', pct <= 34);
  setText(ui.hpNum, 'hp', String(Math.ceil(p.health)));
  setText(ui.cntBottle, 'b', String(p.ammo.bottle));
  setText(ui.cntTrash, 't', String(p.ammo.trash));
  setText(ui.cntDrink, 'd', String(p.drinks));
  ui.slotBottle.classList.toggle('selected', p.selected === 'bottle');
  ui.slotTrash.classList.toggle('selected', p.selected === 'trash');
  setText(ui.clock, 'clock', fmtTime(game.time));

  let obj = 'Обыщи баки и найди бутылки';
  if (game.bossDead) obj = 'Сдай бутылки в приёме';
  else if (game.defeated >= 4) obj = 'Победи охранника приёма';
  else if (game.defeated >= 1) obj = 'Пробейся через аллейку';
  setText(ui.objective, 'obj', obj);

  // prompt logic
  if (game.state !== 'playing' || game.outro || p.dead) {
    hidePrompt();
    hideSearch();
  } else if (p.action === 'search' && p.searchTarget) {
    hidePrompt();
    showSearch(p.searchTarget.x, p.searchTarget.promptY + 0.15, p.searchProgress);
  } else {
    const c = findSearchable();
    hideSearch();
    if (c) {
      showPrompt('<b>E</b><span>— Обыскать</span>', c.x, c.promptY, false);
    } else if (Math.abs(p.x - BOOTH.x) < BOOTH.range) {
      if (game.bossDead) {
        showPrompt('<b>E</b><span>— Сдать бутылки</span>', BOOTH.x, 3.95, false);
      } else {
        showPrompt('<b>!</b><span>Приём закрыт — убери охранника</span>', BOOTH.x, 3.95, true);
      }
    } else {
      hidePrompt();
    }
  }
}

/* ============================================================
   ОВЕРЛЕИ / ЦИКЛ ИГРЫ
   ============================================================ */
function startOverlayHTML() {
  return `
  <div class="card">
    <div class="kicker">Уличный браулер · один район</div>
    <h1 class="title">Помойный <span class="accent">замес</span></h1>
    <p class="sub">Город не любит слабых. Обыщи баки, набери стеклотары, наваляй конкурентам и донеси добычу до приёма бутылок.</p>
    <div class="controls">
      <div class="ctl"><span class="keys"><kbd>A</kbd><kbd>D</kbd></span> Движение</div>
      <div class="ctl"><span class="keys"><kbd>Пробел</kbd></span> Прыжок</div>
      <div class="ctl"><span class="keys"><kbd>J</kbd></span> Удар кулаком</div>
      <div class="ctl"><span class="keys"><kbd>K</kbd></span> Бросок снаряда</div>
      <div class="ctl"><span class="keys"><kbd>Tab</kbd></span> Бутылка / мусор</div>
      <div class="ctl"><span class="keys"><kbd>E</kbd></span> Обыскать (держать)</div>
      <div class="ctl"><span class="keys"><kbd>Q</kbd></span> Выпить для лечения</div>
      <div class="ctl"><span class="keys"><kbd>R</kbd></span> Заново после боя</div>
    </div>
    <p class="tip">Бутылки бьют больнее мусора и летят дальше. Держи <kbd>E</kbd> у бака — лут сам прыгнет в карман.</p>
    <button class="btn" data-action="start">Начать</button>
  </div>`;
}

function defeatOverlayHTML() {
  return `
  <div class="card">
    <div class="kicker red">Нокаут</div>
    <h1 class="title">Тебя <span class="accent red">уложили</span></h1>
    <p class="sub">Аллейка оказалась сильнее. Соберись — и ещё разок.</p>
    <button class="btn" data-action="restart" style="margin-top:24px">Попробовать снова</button>
    <p class="tiny">или нажми R</p>
  </div>`;
}

function victoryOverlayHTML() {
  const score = 250 + game.defeated * 100 + game.bonus;
  return `
  <div class="card">
    <div class="kicker green">Приём сдачи</div>
    <h1 class="title">Уровень <span class="accent">пройден</span></h1>
    <div class="stats">
      <span>Время</span><b>${fmtTime(game.finalTime || game.time)}</b>
      <span>Побеждено соперников</span><b>${game.defeated} / ${game.totalEnemies}</b>
      <span>Сдано бутылок</span><b>${game.recycled}</b>
      <span>Бонус за стекло</span><b>+${game.bonus}</b>
      <span class="total">Итог</span><b class="total">${score}</b>
    </div>
    <button class="btn" data-action="restart">Играть снова</button>
    <p class="tiny">или нажми R</p>
  </div>`;
}

function showOverlay(kind) {
  if (kind === 'start') ui.overlay.innerHTML = startOverlayHTML();
  else if (kind === 'dead') ui.overlay.innerHTML = defeatOverlayHTML();
  else ui.overlay.innerHTML = victoryOverlayHTML();
  ui.overlay.classList.add('show');
  game.overlayKind = kind;
}
function hideOverlay() {
  ui.overlay.classList.remove('show');
  game.overlayKind = null;
  lastHud = {};
}

ui.overlay.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  Sfx.init();
  if (btn.dataset.action === 'start') startPlaying();
  else if (btn.dataset.action === 'restart') restartFromOverlay();
});

function startPlaying() {
  hideOverlay();
  if (game.state === 'start') {
    resetRun();
  }
  game.state = 'playing';
  game.outro = null;
  game.outroT = 0;
  game.time = 0;
  clearInputs();
  updateCamera(0.016);
  game.camX = clamp(player.x + 0.7, game.camMin, game.camMax);
}

function restartFromOverlay() {
  Sfx.init();
  resetRun();
  hideOverlay();
  game.state = 'playing';
  game.outro = null;
  game.outroT = 0;
  game.time = 0;
  clearInputs();
  game.camX = clamp(player.x + 0.7, game.camMin, game.camMax);
}

function depositBottles() {
  if (game.state !== 'playing' || game.outro) return;
  game.recycled = player.ammo.bottle;
  game.bonus = game.recycled * 40;
  player.ammo.bottle = 0;
  game.finalTime = game.time;
  game.outro = 'won';
  game.outroT = 0;
  game.state = 'outro';
  player.action = 'none';
  player.vx = 0;
  Sfx.recyle();
  setTimeout(() => Sfx.win(), 250);
  floatTextWorld('+' + game.bonus, BOOTH.x, 3.0, 'heal');
  burstSparks(BOOTH.x, 1.6, 0.5, 10);
  game.shake = 0.15;
}

function finishOutro() {
  if (game.outro === 'dead') {
    game.state = 'dead';
    showOverlay('dead');
  } else if (game.outro === 'won') {
    game.state = 'won';
    showOverlay('won');
  }
  game.outro = null;
}

function resetRun() {
  // clear dynamic
  game.dynamic.clear();
  // dispose run materials
  for (const m of game.runMats) {
    try { m.dispose(); } catch (e) { /* ignore */ }
  }
  game.runMats = [];
  // clear HTML floaters
  ui.worldUI.querySelectorAll('.floater').forEach(el => el.remove());

  game.characters = [];
  game.enemies = [];
  game.containers = [];
  game.projectiles = [];
  game.particles = [];
  game.loot = [];
  game.pickups = [];
  game.defeated = 0;
  game.bossDead = false;
  game.recycled = 0;
  game.bonus = 0;
  game.firstSearch = false;
  game.finalTime = 0;
  game.time = 0;
  game.outro = null;
  game.outroT = 0;
  game.shake = 0;
  game.hitstop = 0;
  lastHud = {};
  promptState = '';

  // reset booth state
  boothLampMat.color.setHex(0x8a4038);
  boothLampMat.emissive.setHex(0x5a1a10);
  boothLampMat.emissiveIntensity = 0.6;

  player = createPlayer();
  game.characters.push(player.ch);

  for (let i = 0; i < ENEMY_SPECS.length; i++) {
    const e = createEnemy(ENEMY_SPECS[i], i);
    game.enemies.push(e);
  }

  buildContainers();

  updateHUD();
  hidePrompt();
  hideSearch();
  ui.prompt.classList.add('hidden');
  ui.search.classList.add('hidden');

  game.camX = clamp(player.x + 0.7, game.camMin, game.camMax);
}

/* ============================================================
   ОБНОВЛЕНИЕ ВИЗУАЛА
   ============================================================ */
function updateVisuals(dt) {
  for (const ch of game.characters) updateCharAnim(ch, dt);
  updateBars();

  // ambient paper
  const tm = game.time;
  for (const a of game.ambient) {
    const m = a.mesh;
    m.position.x = a.baseX + Math.sin(tm * a.speed * 0.7 + a.phase) * 2.2;
    m.position.z = a.baseZ + Math.cos(tm * a.speed * 0.5 + a.phase) * 0.35;
    m.position.y = 0.04 + Math.abs(Math.sin(tm * a.speed * 1.7 + a.phase)) * 0.22;
    m.rotation.z += dt * 0.6 * a.speed;
  }

  // booth zone glow
  const pulse = 0.5 + 0.5 * Math.sin(tm * 2.2);
  zoneMat.opacity = (game.bossDead ? 0.2 : 0.07) + pulse * (game.bossDead ? 0.12 : 0.03);
  for (const s of stars) {
    s.mat.opacity = 0.3 + pulse * 0.3 + (game.bossDead ? 0.25 : 0);
  }
  if (game.beamMat) {
    game.beamMat.opacity = (game.bossDead ? 0.55 : 0.16) + pulse * (game.bossDead ? 0.18 : 0.05);
    game.beamMat.color.setHex(game.bossDead ? 0x8ee096 : 0xb98272);
  }

}


/* ============================================================
   ОСНОВНОЙ ЦИКЛ
   ============================================================ */
const STEP = 1 / 120;
let lastTime = performance.now();
let accumulator = 0;

function updateGame(dt) {
  game.time += dt;
  updatePlayer(dt);
  updateEnemies(dt);
  updateProjectiles(dt);
  updateLoot(dt);
  updateParticles(dt);
  updateContainers(dt);
  updateInteraction(dt);
  updateCamera(dt);

  input.drinkPress = false;
  input.switchPress = false;
  input.ePress = false;

  if (game.outro) {
    game.outroT += dt;
    if (game.outroT > 1.55) finishOutro();
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  updateCameraVisual(dt);

  if (game.hitstop > 0) {
    game.hitstop = Math.max(0, game.hitstop - dt);
  } else if (game.state === 'playing' || game.state === 'outro') {
    accumulator += dt;
    let steps = 0;
    while (accumulator >= STEP && steps < 6) {
      updateGame(STEP);
      accumulator -= STEP;
      steps++;
      if (game.hitstop > 0) break;
    }
    if (steps >= 6) accumulator = 0;
  } else {
    accumulator = 0;
  }

  // idle animation for the start screen
  if (game.state === 'start') {
    game.time += dt * 0.6;
  }

  updateVisuals(dt);
  updateHUD();
  renderer.render(scene, camera);
}

/* ============================================================
   RESIZE
   ============================================================ */
function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const aspect = w / h;
  let vh = Math.max(9.2, Math.min(13.5, 12.8 / aspect));
  const vw = vh * aspect;
  camera.left = -vw / 2;
  camera.right = vw / 2;
  camera.top = vh / 2;
  camera.bottom = -vh / 2;
  camera.updateProjectionMatrix();
  game.viewW = vw;
  game.viewH = vh;
  game.camY = vh / 2 - 1.55;

  const half = vw / 2;
  const centerX = (LV.left + LV.right) / 2;
  if (vw >= LV.right - LV.left) {
    game.camMin = centerX;
    game.camMax = centerX;
  } else {
    game.camMin = half;
    game.camMax = LV.right - half;
  }
  game.camX = clamp(game.camX, game.camMin, game.camMax);
}
window.addEventListener('resize', resize);

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
buildScenery();
resize();
resetRun();
game.state = 'start';
game.camX = clamp(player.x + 0.7, game.camMin, game.camMax);
showOverlay('start');
updateCameraVisual(0.016);
renderer.render(scene, camera);

// debug hook (used by automated checks)
window.__pm = {
  game,
  get player() { return player; },
  renderer,
  scene,
  camera,
  input,
  resetRun,
  startPlaying,
  step(n = 1, dt = 1 / 120) {
    for (let i = 0; i < n; i++) updateGame(dt);
  }
};

requestAnimationFrame(frame);
</script>
