const TAU = Math.PI * 2;

function mat(hex, o = {}) {
  return new THREE.MeshStandardMaterial({
    color: hex,
    roughness: o.rough !== undefined ? o.rough : 0.92,
    metalness: o.metal || 0,
    flatShading: o.smooth ? false : true,
    side: o.double ? THREE.DoubleSide : THREE.FrontSide
  });
}

/* ============================================================
   Helpers
   ============================================================ */
function add(parent, obj) {
  obj.castShadow = true;
  obj.receiveShadow = true;
  parent.add(obj);
  return obj;
}

function box(w, h, d, material, parent, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  return add(parent, m);
}

function blob(r, sx, sy, sz, material, parent, x = 0, y = 0, z = 0, detail = 0) {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, detail), material);
  m.scale.set(sx, sy, sz);
  m.position.set(x, y, z);
  return add(parent, m);
}

function loftGeo(levels, segs = 8, opt = {}) {
  const rib = opt.rib || 0;
  const phase = opt.phase !== undefined ? opt.phase : Math.PI / segs;
  const rings = levels.map(lv => {
    const arr = [];
    for (let i = 0; i < segs; i++) {
      const a = (i / segs) * TAU + phase + (lv.rot || 0);
      const rr = 1 + (rib ? (i % 2 ? rib : -rib) : 0);
      arr.push(new V(
        (lv.x || 0) + Math.sin(a) * lv.rx * rr,
        lv.y,
        (lv.z || 0) + Math.cos(a) * lv.rz * rr
      ));
    }
    return arr;
  });
  const pos = [];
  const T = (a, b, c) => pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
  for (let l = 0; l < rings.length - 1; l++) {
    const A = rings[l], B = rings[l + 1];
    for (let i = 0; i < segs; i++) {
      const j = (i + 1) % segs;
      T(A[i], B[j], B[i]);
      T(A[i], A[j], B[j]);
    }
  }
  const cap = (ring, up) => {
    let cx = 0, cz = 0;
    for (const p of ring) { cx += p.x; cz += p.z; }
    cx /= ring.length; cz /= ring.length;
    const c = new V(cx, ring[0].y, cz);
    for (let i = 0; i < segs; i++) {
      const j = (i + 1) % segs;
      if (up) T(c, ring[i], ring[j]);
      else T(c, ring[j], ring[i]);
    }
  };
  if (!opt.openTop) cap(rings[rings.length - 1], true);
  if (!opt.openBottom) cap(rings[0], false);

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

function loft(levels, segs, material, parent, opt = {}) {
  return add(parent, new THREE.Mesh(loftGeo(levels, segs, opt), material));
}

function arcShellGeo(levels, segs, gap, thick) {
  const a0 = gap, a1 = TAU - gap;
  const outer = [], inner = [];
  for (const lv of levels) {
    const o = [], n = [];
    const x = lv.x || 0, z = lv.z || 0;
    for (let i = 0; i <= segs; i++) {
      const a = a0 + (a1 - a0) * (i / segs);
      const sx = Math.sin(a), cz = Math.cos(a);
      o.push(new V(x + sx * lv.rx, lv.y, z + cz * lv.rz));
      n.push(new V(x + sx * (lv.rx - thick), lv.y, z + cz * (lv.rz - thick)));
    }
    outer.push(o); inner.push(n);
  }
  const pos = [];
  const T = (a, b, c) => pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
  const Q = (a, b, c, d) => { T(a, b, c); T(a, c, d); };
  const L = levels.length - 1;

  for (let l = 0; l < L; l++) {
    for (let i = 0; i < segs; i++) {
      Q(outer[l][i], outer[l][i + 1], outer[l + 1][i + 1], outer[l + 1][i]);
      Q(inner[l][i], inner[l + 1][i], inner[l + 1][i + 1], inner[l][i + 1]);
    }
    Q(outer[l][0], outer[l + 1][0], inner[l + 1][0], inner[l][0]);
    Q(outer[l][segs], inner[l][segs], inner[l + 1][segs], outer[l + 1][segs]);
  }
  for (let i = 0; i < segs; i++) {
    Q(outer[L][i], inner[L][i], inner[L][i + 1], outer[L][i + 1]);
    Q(outer[0][i], outer[0][i + 1], inner[0][i + 1], inner[0][i]);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

function sweepGeo(points, width, thick, opt = {}) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new V(...p)), false, 'catmullrom', 0.3);
  const steps = opt.steps || Math.max(20, points.length * 7);
  const center = new V(...(opt.center || [0, 1.15, 0]));
  const rings = [];
  for (let s = 0; s <= steps; s++) {
    const u = s / steps;
    const p = curve.getPointAt(u);
    const t = curve.getTangentAt(u).normalize();
    let n = p.clone().sub(center);
    n.addScaledVector(t, -n.dot(t));
    if (n.lengthSq() < 1e-7) n.set(0, 0, 1);
    n.normalize();
    let b = new V().crossVectors(t, n);
    if (b.lengthSq() < 1e-7) b.set(1, 0, 0);
    b.normalize();
    n.crossVectors(b, t).normalize();
    const hw = width * 0.5, ht = thick * 0.5;
    rings.push([
      p.clone().addScaledVector(b, hw).addScaledVector(n, ht),
      p.clone().addScaledVector(b, -hw).addScaledVector(n, ht),
      p.clone().addScaledVector(b, -hw).addScaledVector(n, -ht),
      p.clone().addScaledVector(b, hw).addScaledVector(n, -ht)
    ]);
  }
  const pos = [];
  const T = (a, b, c) => pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
  const Q = (a, b, c, d) => { T(a, b, c); T(a, c, d); };
  for (let s = 0; s < steps; s++) {
    const A = rings[s], B = rings[s + 1];
    for (let k = 0; k < 4; k++) {
      const k2 = (k + 1) % 4;
      Q(A[k], A[k2], B[k2], B[k]);
    }
  }
  Q(rings[0][0], rings[0][2], rings[0][1], rings[0][3]);
  const last = rings[rings.length - 1];
  Q(last[0], last[1], last[2], last[3]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

function sweep(points, width, thick, material, parent, opt = {}) {
  return add(parent, new THREE.Mesh(sweepGeo(points, width, thick, opt), material));
}

function plate(pts, material, parent) {
  const v = pts.map(p => new V(...p));
  const pos = [];
  for (let i = 1; i < v.length - 1; i++) {
    pos.push(v[0].x, v[0].y, v[0].z, v[i].x, v[i].y, v[i].z, v[i + 1].x, v[i + 1].y, v[i + 1].z);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return add(parent, new THREE.Mesh(g, material));
}

function poly(verts, faces, material, parent) {
  const v = verts.map(p => new V(...p));
  const center = new V();
  for (const p of v) center.add(p);
  center.divideScalar(v.length);
  const pos = [];
  const e1 = new V(), e2 = new V(), n = new V(), mid = new V();
  for (const f of faces) {
    for (let i = 1; i < f.length - 1; i++) {
      let a = v[f[0]], b = v[f[i]], c = v[f[i + 1]];
      // wind every triangle outward so front-face culling never hollows the shape
      n.crossVectors(e1.subVectors(b, a), e2.subVectors(c, a));
      mid.copy(a).add(b).add(c).divideScalar(3).sub(center);
      if (n.dot(mid) < 0) [b, c] = [c, b];
      pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return add(parent, new THREE.Mesh(g, material));
}

/* Thick band wrapping the jaw, with a variable top/bottom profile */
function bandGeo(samples, thick) {
  const ot = [], ob = [], it = [], ib = [];
  for (const s of samples) {
    const sx = Math.sin(s.a), cz = Math.cos(s.a);
    ot.push(new V(sx * s.rx, s.top, cz * s.rz));
    ob.push(new V(sx * s.rx, s.bot, cz * s.rz));
    it.push(new V(sx * (s.rx - thick), s.top, cz * (s.rz - thick)));
    ib.push(new V(sx * (s.rx - thick), s.bot, cz * (s.rz - thick)));
  }
  const pos = [];
  const T = (a, b, c) => pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
  const Q = (a, b, c, d) => { T(a, b, c); T(a, c, d); };
  const n = samples.length;
  for (let i = 0; i < n - 1; i++) {
    Q(ot[i], ob[i], ob[i + 1], ot[i + 1]);
    Q(it[i], it[i + 1], ib[i + 1], ib[i]);
    Q(ot[i], ot[i + 1], it[i + 1], it[i]);
    Q(ob[i], ib[i], ib[i + 1], ob[i + 1]);
  }
  Q(ot[0], it[0], ib[0], ob[0]);
  Q(ot[n - 1], ob[n - 1], ib[n - 1], it[n - 1]);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  return g;
}

function tube(a, b, ra, rb, material, sides = 7) {
  const A = new V(...a), B = new V(...b);
  const len = A.distanceTo(B);
  const g = new THREE.CylinderGeometry(rb, ra, len, sides, 1, false);
  const m = new THREE.Mesh(g, material);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new V(0, 1, 0), B.clone().sub(A).normalize());
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function addTube(parent, a, b, ra, rb, material, sides = 7) {
  return add(parent, tube(a, b, ra, rb, material, sides));
}

function fingerChain(parent, pts, r0, r1, material, sides = 5) {
  const n = pts.length - 1;
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 1) / n;
    addTube(parent, pts[i], pts[i + 1],
      r0 + (r1 - r0) * t0, r0 + (r1 - r0) * t1, material, sides);
    if (i > 0) {
      const rr = r0 + (r1 - r0) * t0;
      blob(rr * 1.02, 1, 1, 1, material, parent, pts[i][0], pts[i][1], pts[i][2], 0);
    }
  }
  blob(r1 * 1.08, 1, 1, 1, material, parent, pts[n][0], pts[n][1], pts[n][2], 0);
}

function pivotWithSpace(parent, x, y, z) {
  const pivot = new THREE.Group();
  pivot.position.set(x, y, z);
  const space = new THREE.Group();
  space.position.set(-x, -y, -z);
  pivot.add(space);
  parent.add(pivot);
  return { pivot, space };
}

   Diorama
   ============================================================ */
const GY = 0.012;

function shapeFromXZ(points) {
  const s = new THREE.Shape();
  s.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) s.lineTo(points[i][0], points[i][1]);
  s.closePath();
  return s;
}

(function buildGround() {
  const ground = new THREE.Group();
  scene.add(ground);

  const slabPts = [
    [-1.4, -0.93], [-0.9, -1.16], [-0.1, -1.18], [0.86, -1.06],
    [1.38, -0.64], [1.45, 0.3], [1.05, 0.94], [0.14, 1.12],
    [-0.74, 1.07], [-1.32, 0.54]
  ];
  const baseGeo = new THREE.ExtrudeGeometry(shapeFromXZ(slabPts), { depth: 0.24, bevelEnabled: false });
  baseGeo.rotateX(Math.PI / 2);
  const base = new THREE.Mesh(baseGeo, [MAT.pavementD, MAT.pavementD]);
  base.receiveShadow = true;
  base.castShadow = true;
  ground.add(base);

  const tiles = [
    [0, 0, 1.5, 1.18, MAT.pavement],
    [-1.05, 0.0, 0.54, 1.76, MAT.pavement2],
    [1.04, 0.02, 0.54, 1.6, MAT.pavement3],
    [0, 0.85, 1.5, 0.46, MAT.pavement2],
    [0, -0.85, 1.5, 0.46, MAT.pavement3]
  ];
  for (const [x, z, w, d, m] of tiles) {
    const t = box(w, 0.014, d, m, ground, x, 0.005, z);
    t.castShadow = false;
  }

  // slight tonal variation inside the big slab
  const shade = new THREE.Mesh(new THREE.PlaneGeometry(1.42, 0.5), new THREE.MeshStandardMaterial({
    color: 0x8b8a84, roughness: 0.96, transparent: true, opacity: 0.28
  }));
  shade.rotation.x = -Math.PI / 2;
  shade.position.set(-0.1, 0.0125, 0.28);
  shade.castShadow = false;
  ground.add(shade);

  // cracks
  const crack = (pts) => {
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
      const c = box(len, 0.003, 0.007, MAT.seam, ground, (a[0] + b[0]) / 2, 0.0125, (a[1] + b[1]) / 2);
      c.rotation.y = -Math.atan2(b[1] - a[1], b[0] - a[0]);
      c.castShadow = false;
    }
  };
  crack([[-0.48, 0.24], [-0.34, 0.3], [-0.28, 0.43]]);
  crack([[0.58, -0.4], [0.7, -0.34], [0.76, -0.24]]);
  crack([[-0.9, 0.55], [-0.86, 0.68], [-0.93, 0.76]]);

  // curb + asphalt on the right side
  box(0.16, 0.3, 2.2, MAT.curb, ground, -1.37, -0.12, 0.0);
  box(0.18, 0.022, 2.2, MAT.pavement3, ground, -1.37, 0.034, 0.0);
  const road = box(0.52, 0.14, 2.24, MAT.asphalt, ground, -1.72, -0.2, 0.0);
  road.receiveShadow = true;

  // puddle near the curb
  const pp = [];
  const pc = 9;
  for (let i = 0; i < pc; i++) {
    const a = (i / pc) * TAU;
    const r = 0.19 + 0.05 * Math.sin(i * 2.1) + 0.026 * Math.cos(i * 3.4);
    pp.push([Math.cos(a) * r * 1.2, Math.sin(a) * r * 0.7]);
  }
  const pg = new THREE.ShapeGeometry(shapeFromXZ(pp));
  pg.rotateX(-Math.PI / 2);
  const puddle = new THREE.Mesh(pg, MAT.puddle);
  puddle.position.set(-1.1, 0.0145, 0.36);
  ground.add(puddle);
  const puddleRim = new THREE.Mesh(pg.clone(), MAT.pavementD);
  puddleRim.scale.set(1.09, 1, 1.09);
  puddleRim.position.set(-1.1, 0.0132, 0.36);
  ground.add(puddleRim);

  // old dark stain on the pavement
  const sp = [];
  for (let i = 0; i < 8; i++) {

function buildLeg(cfg) {
  const g = new THREE.Group();
  character.add(g);

  const hip = cfg.hip, knee = cfg.knee, ankle = cfg.ankle;

  add(g, tube(hip, knee, 0.098, 0.082, MAT.trouser, 8));
  blob(0.085, 1, 1, 1, MAT.trouser, g, knee[0], knee[1], knee[2], 1);
  add(g, tube(knee, ankle, 0.082, 0.064, MAT.trouser, 8));
  const cuff = add(g, tube(
    [ankle[0], ankle[1] + 0.072, ankle[2] - 0.005],
    [ankle[0], ankle[1] + 0.005, ankle[2]],
    0.086, 0.08, MAT.trouserD, 8
  ));
  cuff.rotation.z = cfg.cuffTilt;

  // soft fold lines
  addTube(g,
    [hip[0] + 0.035, hip[1] - 0.06, hip[2] + 0.045],
    [knee[0] + 0.02, knee[1] + 0.09, knee[2] + 0.04],
    0.006, 0.003, MAT.trouserD, 4);
  addTube(g,
    [knee[0] - 0.035, knee[1] - 0.04, knee[2] + 0.045],
    [ankle[0] - 0.02, ankle[1] + 0.1, ankle[2] + 0.035],
    0.006, 0.003, MAT.trouserD, 4);

  if (cfg.patch) {
    plate([
      [knee[0] - 0.056, knee[1] + 0.055, knee[2] + 0.083],
      [knee[0] + 0.054, knee[1] + 0.06, knee[2] + 0.082],
      [knee[0] + 0.05, knee[1] - 0.055, knee[2] + 0.092],
      [knee[0] - 0.054, knee[1] - 0.05, knee[2] + 0.088]
    ], MAT.patchBlue, g);
    for (let i = -1; i <= 1; i++) {
      const st = box(0.017, 0.003, 0.003, MAT.trouserD, g,
        knee[0] + i * 0.033, knee[1] + 0.046, knee[2] + 0.1);
      st.castShadow = false;
    }
  }
  if (cfg.tear) {
    plate([
      [knee[0] - 0.033, knee[1] + 0.028, knee[2] + 0.088],
      [knee[0] + 0.024, knee[1] + 0.043, knee[2] + 0.086],
      [knee[0] + 0.033, knee[1] - 0.028, knee[2] + 0.092],
      [knee[0] - 0.024, knee[1] - 0.043, knee[2] + 0.094]
    ], MAT.patchTan, g);
    box(0.047, 0.02, 0.028, MAT.trouserD, g, knee[0], knee[1] - 0.033, knee[2] + 0.083);
    for (let i = 0; i < 3; i++) {
      addTube(g,
        [knee[0] - 0.028 + i * 0.028, knee[1] + 0.028, knee[2] + 0.09],
        [knee[0] - 0.032 + i * 0.03, knee[1] - 0.006, knee[2] + 0.097],
        0.0026, 0.0011, MAT.trouserD, 3);
    }
  }

  buildBoot(g, cfg);
  return g;
}

function buildBoot(parent, cfg) {

  sg.rotateX(Math.PI / 2);

  }

  loft([

    { y: 0.145, rx: 0.064, rz: 0.118, z: 0.008 },

    { y: 0.315, rx: 0.055, rz: 0.068, z: -0.018 }
  ], 8, MAT.boot, b);

  const toe = blob(0.06, 1.0, 0.6, 1.1, worn ? MAT.scuff : MAT.boot, b, 0, 0.1, 0.118, 1);
  toe.rotation.x = -0.12;
  add(b, tube([0, 0.275, -0.018], [0, 0.318, -0.018], 0.064, 0.058, MAT.bootD, 8));

  for (let i = 0; i < 3; i++) {
    const l = box(0.072, 0.007, 0.011, MAT.lace, b, 0, 0.175 + i * 0.035, 0.05 - i * 0.017);
    l.rotation.x = 0.6;
    l.rotation.z = i % 2 ? 0.14 : -0.14;
  }
  const tongue = box(0.06, 0.082, 0.013, MAT.bootD, b, 0, 0.205, 0.05);
  tongue.rotation.x = 0.55;

  if (worn) {
    const s1 = blob(0.038, 1.3, 0.5, 0.35, MAT.scuff, b, 0.037, 0.16, 0.032, 0);
    s1.rotation.z = -0.3;
    box(0.052, 0.005, 0.048, MAT.scuff, b, -0.044, 0.12, -0.038);
  } else {
    box(0.038, 0.005, 0.036, MAT.scuff, b, 0.049, 0.148, -0.02);
  }
}

function beardSample(a) {
  const aa = Math.abs(a);
  for (let i = 0; i < beardTable.length - 1; i++) {
    const p = beardTable[i], q = beardTable[i + 1];
    if (aa <= q[0]) {

      return { top: p[1] + (q[1] - p[1]) * t, bot: p[2] + (q[2] - p[2]) * t };
    }
  }
  return { top: 0.192, bot: 0.136 };
}

  const band = new THREE.Mesh(new THREE.TorusGeometry(0.073, 0.007, 4, 12), MAT.strapD);
  band.rotation.y = Math.PI / 2;
  band.position.set(s * 0.115, 0.93, -0.322);
  add(pack, band);
  box(0.026, 0.028, 0.014, MAT.metalD, pack, s * 0.115, 0.995, -0.29);
}

// mug hanging on the side
const mugPivot = new THREE.Group();
mugPivot.position.set(0.197, 1.175, -0.36);
pack.add(mugPivot);
const mugBody = new THREE.Mesh(new THREE.CylinderGeometry(0.033, 0.031, 0.075, 8, 1, true), MAT.metal);
mugBody.position.set(0.032, -0.07, 0.0);
add(mugPivot, mugBody);
const mugBottom = new THREE.Mesh(new THREE.CircleGeometry(0.031, 8), MAT.metalD);
mugBottom.rotation.x = Math.PI / 2;
mugBottom.position.set(0.032, -0.107, 0);
add(mugPivot, mugBottom);
const mugHandle = new THREE.Mesh(new THREE.TorusGeometry(0.023, 0.0045, 4, 8, Math.PI * 1.25), MAT.metal);
mugHandle.rotation.y = Math.PI / 2;
mugHandle.rotation.z = -0.4;
mugHandle.position.set(0.063, -0.068, 0.0);
add(mugPivot, mugHandle);
const mugLoop = new THREE.Mesh(new THREE.TorusGeometry(0.017, 0.005, 4, 8), MAT.bootD);
mugLoop.rotation.y = Math.PI / 2;
mugLoop.position.set(0.008, -0.008, 0);
add(mugPivot, mugLoop);
box(0.026, 0.024, 0.022, MAT.bootD, pack, 0.19, 1.18, -0.358);

/* ============================================================
   Animation
   ============================================================ */
const clock = new THREE.Clock();
let elapsed = 0;

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  const breath = Math.sin(elapsed * 1.15);

  chestScale.scale.set(1 + breath * 0.004, 1 + breath * 0.007, 1 + breath * 0.004);
  torsoPivot.rotation.x = 0.024 + breath * 0.006 + Math.sin(elapsed * 0.37) * 0.004;
  torsoPivot.rotation.z = Math.sin(elapsed * 0.28) * 0.005;

  headPivot.rotation.y = HEAD_BASE.y + Math.sin(elapsed * 0.31) * 0.038 + breath * 0.01;
  headPivot.rotation.x = HEAD_BASE.x + Math.sin(elapsed * 0.24 + 1.1) * 0.016;
  headPivot.rotation.z = HEAD_BASE.z + Math.sin(elapsed * 0.21 + 0.4) * 0.014;

  leftArm.pivot.rotation.x = -0.008 + breath * 0.005;
  leftArm.pivot.rotation.z = 0.004 + Math.sin(elapsed * 0.33 + 0.6) * 0.006;
  rightArm.pivot.rotation.x = 0.006 + breath * 0.004;
  rightArm.pivot.rotation.z = -0.004 + Math.sin(elapsed * 0.29 + 2.0) * 0.005;

  scarfPivot.rotation.x = Math.sin(elapsed * 1.05) * 0.05;
  scarfPivot.rotation.z = Math.sin(elapsed * 0.83 + 0.7) * 0.045;

  mugPivot.rotation.z = Math.sin(elapsed * 1.6) * 0.07;
  mugPivot.rotation.x = Math.sin(elapsed * 1.25 + 1.2) * 0.05;

  controls.update();
  renderer.render(scene, camera);
});

/* ============================================================
   Sizing
   ============================================================ */
function applySize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

function initialFrame() {
  const aspect = window.innerWidth / window.innerHeight;
  const target = new V(0, 0.96, 0);
  const dist = Math.min(8.6, Math.max(4.5, 5.6 / aspect));
  const dir = new V(2.45, 1.34, 3.3).normalize();
  camera.position.copy(target).addScaledVector(dir, dist);
  controls.target.copy(target);
  controls.update();
}

window.addEventListener('resize', applySize);
applySize();
initialFrame();
</script>
