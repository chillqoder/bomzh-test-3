<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landfill Diorama</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#cfc7bd; }
  canvas { display:block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================== SEEDED RANDOM ============================== */
let _seed = 987651;
function rand(){ _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; }
const rr = (a,b) => a + rand()*(b-a);
const ri = (a,b) => Math.floor(a + rand()*(b-a+1));
const pick = arr => arr[ri(0, arr.length-1)];
function hash2(x, y){ const s = Math.sin(x*127.1 + y*311.7)*43758.5453; return s - Math.floor(s); }
const V3 = (x,y,z)=>new THREE.Vector3(x,y,z);

/* ============================== MATERIALS ============================== */
const matCache = new Map();
function M(color, opts={}){
  const key = color+'|'+(opts.rough??0.94)+'|'+(opts.metal??0)+'|'+(opts.flat??1)+'|'+(opts.side??0)+'|'+(opts.op??1);
  if (!matCache.has(key)){
    matCache.set(key, new THREE.MeshStandardMaterial({
      color, flatShading: !!(opts.flat??1),
      roughness: opts.rough??0.94, metalness: opts.metal??0,
      side: (opts.side??0) ? THREE.DoubleSide : THREE.FrontSide,
      transparent: (opts.op??1) < 1, opacity: opts.op??1,
      polygonOffset: !!opts.poff, polygonOffsetFactor: -1, polygonOffsetUnits: -1
    }));
  }
  return matCache.get(key);
}
const PAL = {
  soilTop1: 0x91755a, soilTop2: 0x7f6a50, moundTint: 0x6e5c48, mud: 0x686450, rut: 0x4c4739,
  soilDark: 0x453328, soilSand: 0x9b7d5e,
  bagCharcoal: 0x2f2e2e, bagOlive: 0x4b4f35, bagBlue: 0x3d5462,
  cardboard: 0x8f6c44, cardboardDark: 0x6b4e31,
  glassGreen: 0x4c7248, glassBrown: 0x6e4a24, glassBlue: 0x64838c,
  canMetal: 0x9ea3a6, canBlue: 0x5d7585, canOrange: 0xb07a3c,
  tire: 0x2e2b28, tireOld: 0x2b2926,
  rust: 0x7c4526, rustDark: 0x5f3820, barrel: 0x8a4a28,
  cream: 0xd9d0b6, creamDirty: 0xc4bb9e,
  yellow: 0xc4a23b, yellowDark: 0x9e8630, steel: 0x33363a, steelDark: 0x26282b,
  window: 0x3a444e, plasticBlue: 0x5f7a8c, plasticGreen: 0x6d7d4b, plasticOrange: 0xb87a3a,
  sofaFabric: 0x757a55, sofaFabric2: 0x86784f, wood: 0x72543a,
  waterMud: 0x5d6350, pondBorder: 0x4c3f2c, stone: 0x8b8074, stone2: 0x6f6960,
  dryGrass: 0x9c8f55, dryGrass2: 0x837b45, leafOlive: 0x6f7448,
  paper: 0xd3ccba, boot: 0x4e4032, metalWire: 0x5b5e60,
  dumpsterGreen: 0x5c6b5a, paintedMetal: 0x60726f
};

/* ============================== SCENE / RENDERER ============================== */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfc7bd);
scene.fog = new THREE.Fog(0xcfc7bd, 52, 95);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(14.5, 11.5, 17.5);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.4, 1.0, 0.2);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 7;
controls.maxDistance = 46;
controls.maxPolarAngle = 1.42;
controls.update();

/* ============================== LIGHTS ============================== */
scene.add(new THREE.HemisphereLight(0xcfd8e4, 0x8a7a5f, 0.65));
const sun = new THREE.DirectionalLight(0xffe0bd, 2.5);
sun.position.set(11, 15, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -16; sun.shadow.camera.right = 16;
sun.shadow.camera.top = 15; sun.shadow.camera.bottom = -14;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 50;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcc4d4, 0.35);
fill.position.set(-10, 8, -7);
scene.add(fill);

/* Presentation surface */
const groundPlate = new THREE.Mesh(new THREE.CircleGeometry(36, 48), M(0xbdb4a7, {flat: 0, rough: 1.0}));
groundPlate.rotation.x = -Math.PI/2;
groundPlate.position.y = -1.11;
groundPlate.receiveShadow = true;
scene.add(groundPlate);

/* ============================== TERRAIN ============================== */
const WORLD = { W: 22, D: 18, bottom: -1.1, seg: 64 };

/* access path: quadratic bezier samples */
const PATH = [];
(function(){
  const p0 = {x:2.7, z:9.2}, p1 = {x:3.1, z:3.4}, p2 = {x:-1.4, z:-0.8};
  for (let i=0; i<=64; i++){
    const t = i/64, u = 1-t;
    PATH.push({ x: u*u*p0.x + 2*u*t*p1.x + t*t*p2.x,
                z: u*u*p0.z + 2*u*t*p1.z + t*t*p2.z });
  }
})();
function pathInfo(x, z){
  let best = 1e9, bi = 0;
  for (let i=0; i<PATH.length; i++){
    const dx = x-PATH[i].x, dz = z-PATH[i].z, d2 = dx*dx+dz*dz;
    if (d2 < best){ best = d2; bi = i; }
  }
  const dist = Math.sqrt(best);
  const t = bi/64;
  const j = Math.min(63, Math.max(0, bi));
  const a = PATH[Math.max(0,j-2)], b = PATH[Math.min(64,j+2)];
  let tx = b.x-a.x, tz = b.z-a.z;
  const l = Math.hypot(tx, tz) || 1; tx/=l; tz/=l;
  return { dist, t, px: PATH[j].x, pz: PATH[j].z, tx, tz, nx: -tz, nz: tx };
}

const MOUND = { x:-2.2, z:-1.2, h:2.7, r:4.8 };
const MOUND2 = { x:7.4, z:-5.2, h:1.65, r:2.5 };
const MOUND3 = { x:-7.7, z:-5.4, h:1.35, r:2.3 };
const POND = { x:-5.0, z:4.8, r:1.35 };
function gauss(dx, dz, r){ return Math.max(0, 1 - (dx*dx+dz*dz)/(r*r)); }

function terrainH(x, z){
  let h = 0.18
    + 0.20*Math.sin(x*0.42+1.7)*Math.cos(z*0.36+0.6)
    + 0.15*Math.sin(x*0.9+3.1)*Math.sin(z*0.75+2.0)
    + 0.07*Math.sin(x*2.1+0.4)*Math.cos(z*1.8+0.5);
  // main mound: overlapping lobes for an uneven, multi-peak silhouette
  h += MOUND.h * gauss(x-MOUND.x, z-MOUND.z, MOUND.r);
  h += 1.35 * gauss(x+3.5, z-0.4, 2.6);
  h += 1.5 * gauss(x+0.7, z+2.7, 2.7);
  h += 0.9 * gauss(x+1.8, z+0.9, 2.2);
  h += 0.5 * gauss(x-1.2, z-3.2, 2.0);
  h -= 0.4 * gauss(x+1.3, z-0.7, 1.5); // saddle notch between lobes
  const mm = Math.max(gauss(x-MOUND.x, z-MOUND.z, MOUND.r), gauss(x+3.5, z-0.4, 2.6),
    gauss(x+0.7, z+2.7, 2.7), gauss(x+1.8, z+0.9, 2.2));
  h += (hash2(x*0.6, z*0.6)-0.35) * 0.4 * mm; // lumpy trash-mass noise
  h += MOUND2.h * gauss(x-MOUND2.x, z-MOUND2.z, MOUND2.r);
  h += MOUND3.h * gauss(x-MOUND3.x, z-MOUND3.z, MOUND3.r);
  const path = pathInfo(x, z);
  if (path.dist < 1.7){
    const k = Math.pow(Math.max(0, 1 - path.dist/1.7), 0.8);
    h -= 0.26 * k;
    for (const side of [-0.52, 0.52]){
      const rx = path.px + path.nx*side, rz = path.pz + path.nz*side;
      const d = Math.hypot(x-rx, z-rz);
      if (d < 0.26 && path.t > 0.04 && path.t < 0.97) h -= 0.11 * (1 - d/0.26);
    }
  }
  const pd = Math.hypot(x-POND.x, z-POND.z);
  if (pd < POND.r+0.45) h -= 0.16 * Math.max(0, 1 - pd/(POND.r+0.45));
  return h;
}
function moundMask(x, z){ return Math.max(gauss(x-MOUND.x, z-MOUND.z, MOUND.r),
  gauss(x-MOUND2.x, z-MOUND2.z, MOUND2.r), gauss(x-MOUND3.x, z-MOUND3.z, MOUND3.r)); }

function topColor(x, z){
  const n = hash2(x*0.7, z*0.7), m = hash2(x*1.9+13, z*1.9+7);
  const c = new THREE.Color(PAL.soilTop1).lerp(new THREE.Color(PAL.soilTop2), clamp01(n*0.5+0.5));
  const mm = moundMask(x, z);
  if (mm > 0) c.lerp(new THREE.Color(PAL.moundTint), mm*0.6);
  const p = pathInfo(x, z);
  if (p.dist < 1.6) c.lerp(new THREE.Color(PAL.mud), Math.pow(1 - p.dist/1.6, 0.7)*0.8);
  for (const side of [-0.52, 0.52]){
    const d = Math.hypot(x-(p.px+p.nx*side), z-(p.pz+p.nz*side));
    if (d < 0.22 && p.t > 0.04 && p.t < 0.97) c.lerp(new THREE.Color(PAL.rut), (1-d/0.22)*0.85);
  }
  const pd = Math.hypot(x-POND.x, z-POND.z);
  if (pd < POND.r+0.5) c.lerp(new THREE.Color(PAL.pondBorder), Math.pow(1-pd/(POND.r+0.5), 0.8)*0.85);
  c.offsetHSL(0, 0, (m-0.5)*0.05);
  return c;
}
function clamp01(v){ return Math.min(1, Math.max(0, v)); }

const terrainGroup = new THREE.Group();
scene.add(terrainGroup);

/* snap helper: exact height of the triangulated surface under (x,z) */
let terrainMeshRef = null;
const _ray = new THREE.Raycaster();
const _down = new THREE.Vector3(0,-1,0);
const _rayOrigin = new THREE.Vector3();
function groundY(x, z){
  if (terrainMeshRef){
    _rayOrigin.set(x, 20, z);
    _ray.set(_rayOrigin, _down);
    _ray.far = 40;
    const hits = _ray.intersectObject(terrainMeshRef, false);
    if (hits.length) return hits[0].point.y;
  }
  return terrainH(x, z);
}

/* ---- top surface: irregular triangulated grid with jitter ---- */
(function buildTop(){
  const S = WORLD.seg, W = WORLD.W, D = WORLD.D;
  const pos = [], col = [];
  const grid = [];
  for (let i=0; i<=S; i++){
    grid[i] = [];
    for (let j=0; j<=S; j++){
      let x = -W/2 + j*W/S, z = -D/2 + i*D/S;
      const edge = (i===0 || i===S || j===0 || j===S);
      if (!edge){ x += (rand()-0.5)*(W/S)*0.75; z += (rand()-0.5)*(D/S)*0.75; }
      const inside = i>0 && i<S && j>0 && j<S;
      grid[i][j] = { x, z, y: terrainH(x, z), inside };
    }
  }
  const push = (v) => { pos.push(v.x, v.y, v.z); const c = topColor(v.x, v.z); col.push(c.r, c.g, c.b); };
  for (let i=0; i<S; i++) for (let j=0; j<S; j++){
    const a = grid[i][j], b = grid[i][j+1], c2 = grid[i+1][j+1], d = grid[i+1][j];
    const flip = (a.inside && rand() > 0.5);
    if (flip){ push(a); push(d); push(c2); push(a); push(c2); push(b); }
    else { push(a); push(d); push(b); push(b); push(d); push(c2); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors:true, flatShading:true, roughness:0.97 }));
  mesh.castShadow = mesh.receiveShadow = true;
  terrainGroup.add(mesh);
  terrainMeshRef = mesh;
})();

/* ---- side skirt with exposed soil layers ---- */
(function buildSkirt(){
  const W = WORLD.W, D = WORLD.D, B = WORLD.bottom;
  const ring = [];
  const S = WORLD.seg;
  for (let j=0; j<=S; j++) ring.push([-W/2 + j*W/S, -D/2]);          // rear (z=-D/2)
  for (let i=0; i<=S; i++) ring.push([W/2, -D/2 + i*D/S]);          // east
  for (let j=S; j>=0; j--) ring.push([-W/2 + j*W/S, D/2]);          // front
  for (let i=S; i>=0; i--) ring.push([-W/2, -D/2 + i*D/S]);         // west
  const pos = [], col = [];
  const cDark = new THREE.Color(PAL.soilDark);
  const cSand = new THREE.Color(PAL.soilSand);
  for (let i=0; i<ring.length; i++){
    const [x0, z0] = ring[i], [x1, z1] = ring[(i+1)%ring.length];
    const cA = topColor(x0, z0), cB = topColor(x1, z1);
    const yA = terrainH(x0, z0), yB = terrainH(x1, z1);
    const botA = [x0, B, z0], botB = [x1, B, z1];
    // two triangles of the strip
    const tri = (p0, p1, p2, c0, c1, c2) => {
      pos.push(p0[0],p0[1],p0[2], p1[0],p1[1],p1[2], p2[0],p2[1],p2[2]);
      col.push(c0.r,c0.g,c0.b, c1.r,c1.g,c1.b, c2.r,c2.g,c2.b);
    };
    const mixK = (c, k) => { const o = c.clone().lerp(cDark, Math.pow(k, 0.7)); if (k<0.35) o.lerp(cSand, 0.12*(1-k/0.35)); return o; };
    tri([x0,yA,z0], [x1,yB,z1], botB, cA, cB, mixK(cB,1));
    tri([x0,yA,z0], botB, botA, cA, mixK(cB,1), mixK(cA,1));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors:true, flatShading:true, roughness:0.98 }));
  mesh.castShadow = mesh.receiveShadow = true;
  terrainGroup.add(mesh);
})();

/* ---- underside ---- */
(function buildBottom(){
  const W = WORLD.W, D = WORLD.D, B = WORLD.bottom;
  const cs = [[-W/2,-D/2],[W/2,-D/2],[W/2,D/2],[-W/2,D/2]];
  const pos = [], col = [];
  const cB = new THREE.Color(PAL.soilDark);
  for (let i=1; i<3; i++){
    pos.push(cs[0][0],B,cs[0][1], cs[i][0],B,cs[i][1], cs[i+1][0],B,cs[i+1][1]);
    col.push(cB.r,cB.g,cB.b, cB.r,cB.g,cB.b, cB.r,cB.g,cB.b);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  terrainGroup.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors:true, flatShading:true, roughness:1 })));
})();

/* ---- helpers for placing objects on terrain ---- */
function placeOnGround(obj, x, z, opts={}){
  const embed = opts.embed||0;
  obj.position.set(x, groundY(x, z) - embed, z);
  if (opts.tilt !== 0){
    obj.rotation.y = opts.yaw !== undefined ? opts.yaw : rand()*Math.PI*2;
    obj.rotation.x += (rand()-0.5)*(opts.tilt??0.09);
    obj.rotation.z += (rand()-0.5)*(opts.tilt??0.09);
  }
}

/* ---- shared geometry utilities ---- */
function jitterGeo(geo, amt, freq=0.35){
  const p = geo.attributes.position;
  const map = new Map();
  for (let i=0; i<p.count; i++){
    const k = p.getX(i).toFixed(3)+','+p.getY(i).toFixed(3)+','+p.getZ(i).toFixed(3);
    if (!map.has(k)) map.set(k, [ (rand()-0.5)*amt*2, (rand()-0.5)*amt*2, (rand()-0.5)*amt*2 ]);
    const o = map.get(k);
    p.setXYZ(i, p.getX(i)+o[0], p.getY(i)+o[1], p.getZ(i)+o[2]);
  }
  geo.computeVertexNormals();
  return geo;
}
function mesh(geo, mat, cast=true){
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast; m.receiveShadow = true;
  return m;
}

/* ============================== TRASH BUILDERS ============================== */
const trashLayer = new THREE.Group(); scene.add(trashLayer);
const flowers = new THREE.Group(); scene.add(flowers); // vegetation

/* ---------- garbage bags ---------- */
const bagGeos = [0,1,2].map(vi => {
  const body = new THREE.IcosahedronGeometry(0.5, 1);
  body.scale(rr(0.95,1.25), rr(0.7,0.95), rr(0.8,1.1));
  const neck = new THREE.CylinderGeometry(0.1, 0.16, 0.28, 7);
  neck.translate(0, 0.55, 0);
  const twist = new THREE.BoxGeometry(0.16, 0.1, 0.2);
  twist.translate(rr(-0.03,0.03), 0.72, 0);
  const g = mergeGeometries([body, neck.toNonIndexed(), twist.toNonIndexed()]);
  jitterGeo(g, 0.09);
  return g;
});
function addBag(x, z, opts={}){
  const s = opts.s || rr(0.55, 1.25);
  const bags = [PAL.bagCharcoal, PAL.bagCharcoal, PAL.bagOlive, PAL.bagBlue];
  const bag = mesh(pick(bagGeos), M(opts.color || pick(bags), {rough:0.85}));
  bag.scale.setScalar(s);
  placeOnGround(bag, x, z, { embed: opts.embed??0.12*s, tilt: opts.tilt??0.35, yaw: opts.yaw });
  (opts.parent||trashLayer).add(bag);
  return bag;
}

/* ---------- cardboard boxes ---------- */
function addCardboardBox(x, z, opts={}){
  const g = new THREE.Group();
  const w = opts.w || rr(0.55, 0.95), h = opts.h || rr(0.4, 0.7), d = opts.d || w*rr(0.75, 1.0);
  const T = 0.035;
  const pm = M(opts.color || PAL.cardboard, {rough:0.98});
  const pm2 = M(PAL.cardboardDark, {rough:0.98});
  g.add(mesh(new THREE.BoxGeometry(w-T, d, T).translate(0, h/2, -d/2+T/2), pm)); // back
  g.add(mesh(new THREE.BoxGeometry(T, d, d-T).translate(-w/2+T/2, h/2, 0), pm)); // left
  g.add(mesh(new THREE.BoxGeometry(T, d, d-T).translate(w/2-T/2, h/2, 0), pm));  // right
  g.add(mesh(new THREE.BoxGeometry(w-T, T, d-T).translate(0, T/2, 0), pm2));     // floor
  if (opts.open){
    const fg = new THREE.BoxGeometry(w-T, d, T);
    const sideF = new THREE.BoxGeometry(T, d, d-T);
    const front = mesh(fg.clone().translate(0, h/2, d/2-T/2), pm);
    // two bent open flaps on top
    const flap = new THREE.BoxGeometry(w*0.5-T, T, d-T*2);
    const f1 = mesh(flap, pm2); f1.position.set(-w/4, h, -d/2+T); f1.rotation.x = rr(0.7,1.2);
    const f2 = mesh(flap.clone(), pm2); f2.position.set(w/4, h, -d/2+T); f2.rotation.x = rr(0.5,0.95);
    g.add(front, f1, f2);
  } else {
    g.add(mesh(new THREE.BoxGeometry(w, T, d).translate(0, h-T/2, 0), pm2));
  }
  if (rand() < 0.5){ g.children[0].scale.x = 0.985; g.children[2].rotation.x = rr(-0.05,0.05); } // crushed corner hint
  jitterGroup(g, 0.012);
  placeOnGround(g, x, z, { embed: opts.embed??0.02, tilt: opts.tilt??0.16, yaw: opts.yaw });
  (opts.parent||trashLayer).add(g);
  return g;
}
function jitterGroup(g, amt){
  // subtle non-uniform scale for a hand-made feel
  g.scale.x *= rr(1-amt, 1+amt); g.scale.z *= rr(1-amt, 1+amt);
}

/* ---------- metal cans ---------- */
function canGeometry(crushed){
  const body = new THREE.CylinderGeometry(0.105, 0.105, 0.28, 10, 3);
  if (crushed) crushGeo(body);
  const rimT = new THREE.TorusGeometry(0.103, 0.014, 4, 12); rimT.rotateX(Math.PI/2); rimT.translate(0, 0.14, 0);
  const rimB = new THREE.TorusGeometry(0.103, 0.014, 4, 12); rimB.rotateX(Math.PI/2); rimB.translate(0, -0.14, 0);
  const g = mergeGeometries([body, rimT, rimB]);
  return g;
}
function crushGeo(geo){
  const p = geo.attributes.position;
  for (let i=0; i<p.count; i++){
    const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const f = 0.6 + hash2(Math.atan2(z,x)*3, y*2)*0.55;
    p.setXYZ(i, x*f, y + hash2(x*4,z*4)*0.03 - 0.015, z*f);
  }
  geo.computeVertexNormals();
}
/* ---------- glass bottles ---------- */
function bottleGeometry(){
  const pts = [
    [0.001,0],[0.095,0.001],[0.112,0.03],[0.112,0.36],[0.095,0.42],[0.05,0.5],

/* ---------- tires ---------- */
function tireGeometry(){
  const t = new THREE.TorusGeometry(0.4, 0.155, 9, 16);
  const parts = [t];
  for (let i=0; i<14; i++){
    const a = i/14*Math.PI*2;
    const box = new THREE.BoxGeometry(0.13, 0.07, 0.16);
    box.translate(0, 0.5, 0);
    box.rotateZ(a);
    parts.push(box);
  }
  const g = mergeGeometries(parts);
  g.rotateX(Math.PI/2);
  return g;
}
const tireGeo = tireGeometry();
function addTire(x, z, opts={}){
  const g = new THREE.Group();
  const t = mesh(tireGeo, M(opts.color || PAL.tire, {rough:0.95}));
  if (opts.flat) t.scale.y = 0.82;
  t.position.y = opts.lift !== undefined ? opts.lift : (opts.flat ? 0.115 : 0.14); // tube rests on ground
  g.add(t);
  if (opts.lean) g.rotation.z = opts.lean;
  placeOnGround(g, x, z, {embed: opts.embed??0.02, tilt: opts.tilt??0, yaw: opts.yaw});
  (opts.parent||trashLayer).add(g);
  return g;
}

const dozer = new THREE.Group();
(function buildDozer(){
  const yellow = M(PAL.yellow, {rough:0.72}), yellowDark = M(PAL.yellowDark, {rough:0.8});
  const steel = M(PAL.steel, {rough:0.55, metal:0.4});

  const rustM = M(PAL.rustDark, {rough:0.85, metal:0.3});

  const trackShapeLen = 2.0, trackShapeH = 0.92, R = 0.3;
  const trackLoop = (() => {
    const mkPath = (path, w, h, r1) => {
      path.moveTo(-w/2+r1, -h/2);
      path.lineTo(w/2-r1, -h/2);   path.absarc(w/2-r1, -h/2+r1, r1, -Math.PI/2, 0);
      path.lineTo(w/2, h/2-r1);    path.absarc(w/2-r1, h/2-r1, r1, 0, Math.PI/2);
      path.lineTo(-w/2+r1, h/2);   path.absarc(-w/2+r1, h/2-r1, r1, Math.PI/2, Math.PI);
      path.lineTo(-w/2, -h/2+r1);  path.absarc(-w/2+r1, -h/2+r1, r1, Math.PI, Math.PI*1.5);
    };
    const shape = new THREE.Shape(); mkPath(shape, trackShapeLen, trackShapeH, R);
    const hole = new THREE.Path(); mkPath(hole, trackShapeLen-0.2, trackShapeH-0.2, R-0.1);
    shape.holes.push(hole);
    const geo = new THREE.ExtrudeGeometry(shape, { depth:0.34, bevelEnabled:false, curveSegments:5 });
    geo.rotateY(Math.PI/2); geo.translate(-0.17, 0, 0);
    return { geo, shape, };
  })();
  const trackGeo = trackLoop.geo;

  // tread plates instanced around the loop
  const platePts = trackLoop.shape.getPoints(6);
  const plateList = [];
  for (let i=0; i<platePts.length; i++){
    const a = platePts[i], b = platePts[(i+1)%platePts.length];
    const d = Math.hypot(b.x-a.x, b.y-a.y);
    const steps = Math.max(1, Math.round(d/0.18));
    for (let s=0; s<steps; s++){
      const t = s/steps;
      plateList.push({ x: a.x+(b.x-a.x)*t, y: a.y+(b.y-a.y)*t,
        tx: (b.x-a.x)/d, ty: (b.y-a.y)/d });
    }
  }
  const plateGeo = new THREE.BoxGeometry(0.16, 0.05, 0.32);
  plateGeo.rotateY(Math.PI/2);
  const qY90 = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI/2, 0));
  for (const side of [-1, 1]){
    const track = new THREE.Group();
    track.add(mesh(trackGeo, rubber));
    // wheels inside
    for (const [wz, wy, wr] of [[-0.62, 0.12, 0.13], [0, 0.15, 0.15], [0.62, 0.12, 0.13], [-0.35, 0.27, 0.08], [0.35, 0.27, 0.08]]){
      const w = mesh(new THREE.CylinderGeometry(wr, wr, 0.3, 10), steel);
      w.rotation.z = Math.PI/2; w.position.set(0, wy, wz);
      track.add(w);
    }
    const inst = new THREE.InstancedMesh(plateGeo, rubber, plateList.length);
    const dummy = new THREE.Object3D();
    plateList.forEach((p, i) => {
      // shape-space (x,y) -> world (z-axis, y-axis): (sx,sy) -> (0, sy, -sx)
      const nl = Math.hypot(p.x, p.y) || 1;
      const nx = p.x/nl, ny = p.y/nl;
      dummy.position.set(0, p.y + ny*0.03, -p.x - nx*0.03);
      const qZ = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, Math.atan2(p.ty, p.tx)));
      dummy.quaternion.copy(qY90).multiply(qZ);
      dummy.scale.setScalar(1);
      dummy.updateMatrix();
      inst.setMatrixAt(i, dummy.matrix);
    });
    inst.castShadow = inst.receiveShadow = true;
    track.add(inst);
    track.position.set(side*0.62, 0.47, -0.1);
    dozer.add(track);
  }

  // track side frames
  for (const side of [-1,1]){
    dozer.add(mesh(new THREE.BoxGeometry(0.36, 0.2, 2.1).translate(0, 0.02, 0), steel).translateX(side*0.61).translateY(1.0).translateZ(-0.1));
  }
  // deck + chassis
  dozer.add(mesh(new THREE.BoxGeometry(1.3, 0.16, 2.05).translate(0, 1.1, -0.1), yellowDark));
  dozer.add(mesh(new THREE.BoxGeometry(1.42, 0.5, 0.95).translate(0, 1.35, 0.55), yellow)); // engine compartment front
  dozer.add(mesh(new THREE.BoxGeometry(1.2, 0.42, 0.95).translate(0, 1.31, -0.55), yellow)); // rear engine cover
  // vents
  for (let i=0; i<3; i++) dozer.add(mesh(new THREE.BoxGeometry(1.44, 0.05, 0.08).translate(0, 1.2+i*0.12, 1.02), steelD));
  // exhaust
  const ex = mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.5, 8), steel);
  ex.position.set(0.4, 1.78, -0.4); dozer.add(ex);
  const exTip = mesh(new THREE.CylinderGeometry(0.065, 0.06, 0.08, 8), rustM);
  exTip.position.set(0.4, 2.05, -0.4); dozer.add(exTip);

  // cabin with thick framing
  const cabX = 0, cabZ = -0.35, cabW = 1.15, cabD = 0.95, cabH = 0.62, cabBase = 1.48;
  const frame = M(PAL.yellowDark, {rough:0.75});
  // corner posts
  for (const sx of [-1,1]) for (const sz of [-1,1]){
    dozer.add(mesh(new THREE.BoxGeometry(0.07, cabH, 0.07).translate(sx*(cabW/2-0.035), cabBase+cabH/2, cabZ+sz*(cabD/2-0.035)), frame));
  }
  dozer.add(mesh(new THREE.BoxGeometry(cabW, 0.06, cabD).translate(cabX, cabBase+cabH+0.03, cabZ), yellowDark)); // roof
  // windows
  const wg = (w, h, x, y, z, ry) => { const p = mesh(new THREE.BoxGeometry(w, h, 0.02), glass); p.position.set(x, y, z); p.rotation.y = ry; dozer.add(p); };
  wg(cabW-0.16, cabH-0.12, cabX, cabBase+cabH/2, cabZ+cabD/2-0.03, 0);
  wg(cabW-0.16, cabH-0.12, cabX, cabBase+cabH/2, cabZ-cabD/2+0.03, 0);
  wg(cabD-0.16, cabH-0.12, cabX-cabW/2+0.03, cabBase+cabH/2, cabZ, Math.PI/2);
  wg(cabD-0.16, cabH-0.12, cabX+cabW/2-0.03, cabBase+cabH/2, cabZ, Math.PI/2);
  // seat + steering visible through cabin
  dozer.add(mesh(new THREE.BoxGeometry(0.42, 0.1, 0.4).translate(cabX, cabBase+0.12, cabZ-0.18), steelD));
  dozer.add(mesh(new THREE.BoxGeometry(0.42, 0.36, 0.08).translate(cabX, cabBase+0.34, cabZ-0.36), steelD));
  const stick = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.3, 6), steel);
  stick.position.set(cabX+0.3, cabBase+0.25, cabZ-0.05); stick.rotation.x = 0.25; dozer.add(stick);

  // front blade — broad, thickness, angled side edges
  const bladeGeo = new THREE.BoxGeometry(2.05, 0.85, 0.14);
  { const p = bladeGeo.attributes.position;
    for (let i=0; i<p.count; i++){
      if (p.getY(i) > 0){ p.setX(i, p.getX(i)*0.8); p.setZ(i, p.getZ(i)-0.06); }
    }
    bladeGeo.computeVertexNormals(); }
  const blade = mesh(bladeGeo, yellow);
  blade.position.set(0, 0.5, 1.5);
  blade.rotation.x = -0.1;
  // blade cutting edge (steel)
  const edge = mesh(new THREE.BoxGeometry(2.0, 0.09, 0.17), steelD);
  edge.position.set(0, 0.13, 1.5);
  edge.rotation.x = -0.1;
  dozer.add(blade, edge);
  // support arms to chassis
  for (const side of [-1,1]){
    const arm = mesh(new THREE.BoxGeometry(0.09, 0.09, 0.8), steel);
    arm.position.set(side*0.62, 0.95, 1.12);
    arm.rotation.x = 0.5;
    dozer.add(arm);
    const pivot = mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.12, 8), steelD);
    pivot.rotation.z = Math.PI/2;

  dozer.add(mesh(new THREE.BoxGeometry(0.5, 0.4, 0.03).translate(-0.3, 1.35, 1.05), rustM));
  for (let i=0; i<5; i++){

(function puddle(){

        const a = Math.atan2(zp, x);

  for (let i=0; i<3; i++){
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.55, 24), new THREE.MeshBasicMaterial({

    if (side === 0){ x = rr(-10.4, 10.4); z = rr(7.6, 8.6); }       // front edge
    else if (side === 1){ x = pick([-10.4, -9.6, 10.4, 9.8]); z = rr(-6, 7); } // sides
    else { x = rr(-10.2, 9.2); z = rr(-8.7, -6.8); }                // rear edge
    if (pathInfo(x, z).dist < 1.6) continue;
    perimeterPts.push([x, z]);
  }
  for (const [x, z] of perimeterPts) grassTuft(x, z, rr(0.8, 1.3));
  // weeds around fence post bases
  for (const x of [-9.4, -7.7, -6.0, -4.3, -2.6]) grassTuft(x+rr(-0.3,0.3), -7.95, rr(1.0, 1.4));
  // a couple of dry bushes in the background
  for (const [x, z] of [[-8.6, -7.4], [8.9, -7.0], [9.6, 4.6]]){
    const bush = new THREE.Group();
    for (let i=0; i<3; i++){
      const b = mesh(new THREE.DodecahedronGeometry(rr(0.28,0.42), 0), M(pick([PAL.leafOlive, 0x7a6f3f]), {rough:1}));
      b.scale.y = rr(0.5,0.65);
      b.position.set(rr(-0.2,0.2), rr(0.2,0.5), rr(-0.2,0.2));
      bush.add(b);
    }
    placeOnGround(bush, x, z, {embed:0.06, tilt:0, yaw: rand()*7});
    flowers.add(bush);
  }
})();

/* ============================== AMBIENT ANIMATION SETUP ============================== */
/* loose piece of paper lifting and settling */
let paper;
(function makePaper(){
  const geo = new THREE.PlaneGeometry(0.36, 0.46, 4, 4);
  const p = geo.attributes.position;
  for (let i=0; i<p.count; i++){
    p.setZ(i, (hash2(p.getX(i)*3, p.getY(i)*3)-0.5)*0.05);
  }
  geo.computeVertexNormals();
  paper = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color:PAL.paper, roughness:0.95, side:THREE.DoubleSide }));
  const px = 2.1, pz = 3.7;
  paper.position.set(px, groundY(px, pz)+0.04, pz);
  paper.userData.baseY = groundY(px, pz)+0.04;
  paper.rotation.x = -Math.PI/2*0.8;
  paper.castShadow = true;
  trashLayer.add(paper);
})();

/* ============================== RENDER LOOP ============================== */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // grass sway
  for (const g of swayers){
    const s = Math.sin(t*1.7 + g.userData.phase)*0.075;
    g.rotation.x = g.userData.baseRX + s*0.6;
    g.rotation.z = g.userData.baseRZ + s;
  }

  // paper: gently lifting and settling
  if (paper){
    const lift = Math.pow(Math.abs(Math.sin(t*0.55 + 0.8)), 2.0);
    paper.position.y = paper.userData.baseY + lift*0.28;
    paper.rotation.z = Math.sin(t*0.55 + 0.8)*0.25;
    paper.rotation.x = -1.2 + Math.sin(t*0.55+0.8)*0.35;
    paper.position.x = 2.1 + Math.sin(t*0.3)*0.12;
  }

  // puddle ripples
  for (const r of ripples){
    const k = (t*0.32 + r.userData.phase) % 1;
    r.scale.setScalar(0.2 + k*1.7);
    r.material.opacity = Math.max(0, (1-k))*0.16;
    r.visible = k > 0.06;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
