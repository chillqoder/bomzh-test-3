/* ------------------------------------------------------------------ */
/*  Deterministic helpers                                              */
/* ------------------------------------------------------------------ */

const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smoothstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hash2(ix, iz, seed) {
  let h = Math.imul(ix, 374761393) + Math.imul(iz, 668265263) + Math.imul(seed, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function valueNoise(x, z, seed) {
  const xi = Math.floor(x), zi = Math.floor(z);
  const xf = x - xi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf);
  const v = zf * zf * (3 - 2 * zf);
  const a = hash2(xi, zi, seed);
  const b = hash2(xi + 1, zi, seed);
  const c = hash2(xi, zi + 1, seed);
  const d = hash2(xi + 1, zi + 1, seed);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}

function fbm(x, z, octaves, seed) {
  let sum = 0, amp = 0.5, freq = 1, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += valueNoise(x * freq, z * freq, seed + i * 17) * amp;
    norm += amp;
    amp *= 0.5;
    freq *= 2.03;
  }
  return sum / norm;
}

const rngGlobal = mulberry32(90210);

/* ------------------------------------------------------------------ */
/*  Geometry helpers                                                   */
/* ------------------------------------------------------------------ */

const boxCache = new Map();
function boxGeom(w, h, d) {
  const key = w.toFixed(3) + '|' + h.toFixed(3) + '|' + d.toFixed(3);
  let g = boxCache.get(key);
  if (!g) { g = new THREE.BoxGeometry(w, h, d); boxCache.set(key, g); }
  return g;
}

function box(parent, w, h, d, material, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(boxGeom(w, h, d), material);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

const cylCache = new Map();
function cylGeom(rt, rb, h, seg) {
  const key = [rt.toFixed(3), rb.toFixed(3), h.toFixed(3), seg].join('|');
  let g = cylCache.get(key);
  if (!g) { g = new THREE.CylinderGeometry(rt, rb, h, seg, 1); cylCache.set(key, g); }
  return g;
}

function cyl(parent, rt, rb, h, seg, material, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(cylGeom(rt, rb, h, seg), material);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

const UP = new THREE.Vector3(0, 1, 0);
function cylinderBetween(parent, a, b, radius, material, segments = 6) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, segments, 1), material);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, dir.normalize());
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m);
  return m;
}

function jitterGeometry(geo, fn) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const o = fn(x, y, z, i);
    p.setXYZ(i, o.x, o.y, o.z);
  }
  p.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

/* ------------------------------------------------------------------ */
/*  Terrain definition                                                 */
/* ------------------------------------------------------------------ */

const RX = 11.0;
const RZ = 9.0;
const PUDDLE = { x: -7.1, z: 5.6, rx: 2.7, rz: 1.95 };

function outline(a) {
  return 1 + 0.043 * Math.sin(3 * a + 1.3) + 0.028 * Math.sin(5 * a - 0.6) +
         0.018 * Math.sin(7 * a + 2.4) + 0.012 * Math.sin(2 * a - 1.9);
}

function radialCoord(x, z) {
  const a = Math.atan2(z / RZ, x / RX);
  const rf = outline(a);
  return Math.sqrt((x / (RX * rf)) ** 2 + (z / (RZ * rf)) ** 2);
}

function baseHeight(x, z) {
  let h = 0.16;
  h += (fbm(x * 0.16 + 3.1, z * 0.16 - 2.2, 3, 7) - 0.5) * 0.62;
  h += (fbm(x * 0.52 - 1.0, z * 0.52 + 4.0, 2, 9) - 0.5) * 0.17;
  return h;
}

const moundLobes = [
  { x: -0.2, z: -1.5, r: 5.8, h: 2.85 },
  { x: -1.9, z: -2.4, r: 3.5, h: 1.20 },
  { x: 2.1, z: -2.1, r: 3.1, h: 1.02 },
  { x: 0.2, z: -4.7, r: 2.7, h: 0.80 },
  { x: -0.8, z: 0.9, r: 3.0, h: 0.72 },
  { x: -8.1, z: -2.6, r: 2.35, h: 0.92 },
  { x: -8.9, z: -1.5, r: 1.6, h: 0.38 },
  { x: 6.4, z: -4.5, r: 2.75, h: 1.10 },
  { x: 7.3, z: -3.3, r: 1.9, h: 0.56 },
];

function moundLift(x, z) {
  let h = 0;
  for (const l of moundLobes) {
    const dx = (x - l.x) / l.r;
    const dz = (z - l.z) / l.r;
    const q = dx * dx + dz * dz;
    if (q < 1) h += l.h * Math.pow(1 - q, 1.35);
  }
  const ridges = (valueNoise(x * 0.9 + 12.3, z * 0.9 - 4.1, 31) - 0.5) * 0.34 +
                 (valueNoise(x * 2.1 - 7.2, z * 2.1 + 3.4, 47) - 0.5) * 0.13;
  return Math.max(0, h + ridges * Math.min(1.6, h * 0.85));
}

function heightAt(x, z) {
  let h = baseHeight(x, z) + moundLift(x, z);
  const pd = ((x - PUDDLE.x) / 2.7) ** 2 + ((z - PUDDLE.z) / 1.95) ** 2;
  h -= 0.39 * Math.exp(-pd * 1.35);
  const s = radialCoord(x, z);
  const edge = smoothstep(0.80, 0.995, s);
  return h * (1 - edge) + 0.03 * edge;
}

function surfaceNormal(x, z, eps = 0.22) {
  const hl = heightAt(x - eps, z), hr = heightAt(x + eps, z);
  const hd = heightAt(x, z - eps), hu = heightAt(x, z + eps);
  return new THREE.Vector3(hl - hr, 2 * eps, hd - hu).normalize();
}

/* ------------------------------------------------------------------ */
/*  Presentation plinth                                                */
/* ------------------------------------------------------------------ */

const plinth = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), M.plinth);
plinth.rotation.x = -Math.PI / 2;
plinth.position.y = -1.52;
plinth.receiveShadow = true;
scene.add(plinth);

/* ------------------------------------------------------------------ */
/*  Terrain top surface                                                */
/* ------------------------------------------------------------------ */

const world = new THREE.Group();
world.name = 'diorama';
scene.add(world);

const terrainGroup = new THREE.Group();
terrainGroup.name = 'ground';
world.add(terrainGroup);

const RINGS = 46;
const SEGS = 168;
const rimPoints = [];

(function buildTerrain() {
  const rng = mulberry32(4471);
  const positions = [];
  const colors = [];
  const indices = [];

  const cLight = new THREE.Color(C.soilLight);
  const cMid = new THREE.Color(C.soilMid);
  const cDark = new THREE.Color(C.soilDark);
  const cTrash = new THREE.Color(0x5c5b4c);
  const cDamp = new THREE.Color(0x4a4739);

  function terrainColor(x, z, y) {
    const n = fbm(x * 0.42 + 2.2, z * 0.42 - 1.1, 3, 61);
    const n2 = valueNoise(x * 2.4 - 5.0, z * 2.4 + 3.4, 73);
    const col = cLight.clone().lerp(cMid, clamp(n * 1.2, 0, 1));
    col.lerp(cDark, n2 * 0.4);
    const lift = moundLift(x, z);
    const trashy = smoothstep(0.3, 1.8, lift) * 0.72;
    if (trashy > 0) col.lerp(cTrash, trashy);
    const pd = ((x - PUDDLE.x) / 3.4) ** 2 + ((z - PUDDLE.z) / 2.7) ** 2;
    col.lerp(cDamp, Math.exp(-pd * 1.1) * 0.62);
    col.offsetHSL(0, (n2 - 0.5) * 0.02, (n2 - 0.5) * 0.04);
    return col;
  }

  // centre vertex
  const cy = heightAt(0, 0);
  positions.push(0, cy, 0);
  const cc = terrainColor(0, 0, cy);
  colors.push(cc.r, cc.g, cc.b);

  for (let i = 1; i <= RINGS; i++) {
    const t = Math.pow(i / RINGS, 1.03);
    for (let j = 0; j < SEGS; j++) {
      const aBase = (j / SEGS) * TAU;
      const jitterA = (i < RINGS) ? (rng() - 0.5) * 0.007 : 0;
      const a = aBase + jitterA;
      const rf = outline(a);
      let x = Math.cos(a) * RX * rf * t;
      let z = Math.sin(a) * RZ * rf * t;
      if (i < RINGS) {
        const amp = 0.17 * (1 - t * t);
        x += (rng() - 0.5) * amp;
        z += (rng() - 0.5) * amp;
      }
      const y = heightAt(x, z);
      positions.push(x, y, z);
      const col = terrainColor(x, z, y);
      colors.push(col.r, col.g, col.b);
      if (i === RINGS) rimPoints.push(new THREE.Vector3(x, y, z));
    }
  }

  // fan from centre to first ring
  for (let j = 0; j < SEGS; j++) {
    const j2 = (j + 1) % SEGS;
    indices.push(0, 1 + j2, 1 + j);
  }
  // rings
  for (let i = 1; i < RINGS; i++) {
    const rowA = 1 + (i - 1) * SEGS;
    const rowB = 1 + i * SEGS;
    for (let j = 0; j < SEGS; j++) {
      const j2 = (j + 1) % SEGS;
      const a = rowA + j, b = rowA + j2, c = rowB + j, d = rowB + j2;
      indices.push(a, b, c, b, d, c);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  g.setIndex(indices);
  g.computeVertexNormals();

  const mesh = new THREE.Mesh(g, M.soil);
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  mesh.name = 'terrain-top';
  terrainGroup.add(mesh);
})();

/* ------------------------------------------------------------------ */
/*  Terrain sides + underside                                          */
/* ------------------------------------------------------------------ */

(function buildTerrainSides() {
  const rng = mulberry32(915);
  const rowsY = [
    (p) => p.y - 0.01,
    (p) => p.y - 0.15,
    (p) => p.y - 0.33,
    () => -0.62,
    () => -0.98,
    () => -1.34,
  ];
  const rowColors = [
    new THREE.Color(0x9d8467),
    new THREE.Color(0x8a7053),
    new THREE.Color(0x715a42),
    new THREE.Color(0x5b4632),
    new THREE.Color(0x463529),
    new THREE.Color(0x33261c),
  ];
  const bulges = [0, 0.01, 0.03, 0.05, 0.035, 0.02];
  const positions = [];
  const colors = [];
  const indices = [];
  const n = rimPoints.length;

  for (let r = 0; r < rowsY.length; r++) {
    for (let j = 0; j < n; j++) {
      const p = rimPoints[j];
      const out = new THREE.Vector3(p.x, 0, p.z).normalize();
      const bulge = bulges[r];
      let y = rowsY[r](p) + (r > 2 ? (rng() - 0.5) * 0.07 : 0);
      const x = p.x + out.x * bulge;
      const z = p.z + out.z * bulge;
      positions.push(x, y, z);
      const col = rowColors[r].clone();
      col.offsetHSL(0, 0, (rng() - 0.5) * 0.03);
      colors.push(col.r, col.g, col.b);
    }
  }

  for (let r = 0; r < rowsY.length - 1; r++) {
    for (let j = 0; j < n; j++) {
      const j2 = (j + 1) % n;
      const a = r * n + j, b = r * n + j2;
      const c = (r + 1) * n + j, d = (r + 1) * n + j2;
      indices.push(a, b, c, b, d, c);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, M.terrainSide);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.name = 'terrain-sides';
  terrainGroup.add(mesh);

  // underside cap
  const underPositions = [];
  const underIndices = [];
  underPositions.push(0, -1.35, 0);
  for (let j = 0; j < n; j++) {
    const p = rimPoints[j];
    underPositions.push(p.x, -1.35, p.z);
  }
  for (let j = 0; j < n; j++) {

function buildRibbon(curve, opts) {
  const { steps = 80, columns = 5, halfWidthAt, yOffset = 0.035, colorFn } = opts;
  const pts = curve.getSpacedPoints(steps);
  const positions = [];
  const colors = [];
  const indices = [];
  for (let i = 0; i <= steps; i++) {
    const p = pts[i];
    const tangent = curve.getTangentAt(i / steps);
    const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
    const w = halfWidthAt(i / steps);
    for (let k = 0; k < columns; k++) {
      const u = columns === 1 ? 0 : (k / (columns - 1)) * 2 - 1;
      const x = p.x + side.x * u * w;
      const z = p.z + side.z * u * w;
      const y = heightAt(x, z) + yOffset;
      positions.push(x, y, z);
      const col = colorFn(u, i / steps, x, z);
      colors.push(col.r, col.g, col.b);
    }
  }
  for (let i = 0; i < steps; i++) {
    for (let k = 0; k < columns - 1; k++) {
      const a = i * columns + k, b = a + 1;
      const c = (i + 1) * columns + k, d = c + 1;
      indices.push(a, b, c, b, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

function rutGeom(offset, width) {
  const steps = 90;
  const positions = [];
  const indices = [];
  const columns = 3;
  for (let i = 0; i <= steps; i++) {
    const p = pathCurve.getSpacedPoints(steps)[i];
    const tangent = pathCurve.getTangentAt(i / steps);
    const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
    const wobble = Math.sin(i * 0.41) * 0.06;
    for (let k = 0; k < columns; k++) {
      const u = (k - 1) * width;
      const x = p.x + side.x * (offset + wobble) + side.x * u;
      const z = p.z + side.z * (offset + wobble) + side.z * u;
      positions.push(x, heightAt(x, z) + 0.055, z);
    }
  }
  for (let i = 0; i < steps; i++) {
    for (let k = 0; k < columns - 1; k++) {
      const a = i * columns + k, b = a + 1;
      const c = (i + 1) * columns + k, d = c + 1;
      indices.push(a, b, c, b, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

function irregularShape(rx, rz, segments, seed, amp = 0.12) {
  const rng = mulberry32(seed);
  const shape = new THREE.Shape();
  for (let i = 0; i < segments; i++) {
    const a = (i / segments) * TAU;
    const r = 1 + Math.sin(a * 3 + seed) * amp + Math.sin(a * 5 - seed * 0.3) * amp * 0.6 +
              (rng() - 0.5) * amp * 0.5;
    const x = Math.cos(a) * rx * r;
    const y = Math.sin(a) * rz * r;
    if (i === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
  }
  shape.closePath();
  return shape;
}

function makeBagGeometry(seed) {
  const g = new THREE.SphereGeometry(1, 9, 6);
  jitterGeometry(g, (x, y, z) => {
    const f = 1 + 0.11 * Math.sin(x * 4.3 + seed) + 0.075 * Math.sin(y * 5.7 + z * 3.1 + seed * 1.7) +
              0.045 * Math.sin(z * 7.3 - seed * 0.8);
    const pinch = 1 - 0.3 * smoothstep(0.12, 0.92, y);
    let yy = y;
    if (y < -0.62) yy = -0.62 + (y + 0.62) * 0.35;
    return { x: x * f * pinch, y: yy * f, z: z * f * pinch };
  });
  return g;
}

function createCardboardBox(rng, open = true) {
  const g = new THREE.Group();
  const w = 0.52 + rng() * 0.72;
  const h = 0.34 + rng() * 0.45;
  const d = 0.45 + rng() * 0.6;
  const t = 0.045;
  const mat = rng() > 0.4 ? M.cardboard : M.cardboardDark;

  box(g, w, t, d, mat, 0, t / 2, 0);
  box(g, w, h, t, mat, 0, h / 2, -d / 2 + t / 2, (rng() - 0.5) * 0.06, 0, 0);
  box(g, w, h, t, mat, 0, h / 2, d / 2 - t / 2, (rng() - 0.5) * 0.06, 0, 0);
  box(g, t, h, d - t * 2, mat, -w / 2 + t / 2, h / 2, 0, 0, 0, (rng() - 0.5) * 0.06);
  box(g, t, h, d - t * 2, mat, w / 2 - t / 2, h / 2, 0, 0, 0, (rng() - 0.5) * 0.06);

  // dark fold line along top edges
  box(g, w, 0.018, 0.02, M.cardboardDark, 0, h + 0.005, -d / 2 + 0.01);
  box(g, w, 0.018, 0.02, M.cardboardDark, 0, h + 0.005, d / 2 - 0.01);

  if (open) {
    const flapT = 0.035;
    const f1 = box(g, w * 0.98, flapT, d * 0.48, mat, 0, h + 0.05, d * 0.73, 0.55, 0, 0);
    const f2 = box(g, w * 0.94, flapT, d * 0.45, mat, 0, h + 0.02, -d * 0.7, -0.38, 0, 0.03);
    const f3 = box(g, w * 0.44, flapT, d * 0.92, mat, -w * 0.72, h + 0.04, 0, 0, 0, -0.7);
    const f4 = box(g, w * 0.4, flapT, d * 0.86, mat, w * 0.68, h - 0.02, 0, 0, 0, -1.1);
    f1.rotation.y = (rng() - 0.5) * 0.2;
    f2.rotation.y = (rng() - 0.5) * 0.2;
    f3.rotation.x = (rng() - 0.5) * 0.3;
    f4.rotation.x = (rng() - 0.5) * 0.3;
    // dark inside
    const inner = new THREE.Mesh(boxGeom(w - t * 2.2, 0.02, d - t * 2.2), M.steelDark);
    inner.position.y = 0.09;
    g.add(inner);
  } else {
    box(g, w, 0.05, d, mat, 0, h + 0.02, 0);
    box(g, 0.08, 0.006, d * 0.99, M.tape, 0, h + 0.052, 0);
  }

  g.scale.set(0.9 + rng() * 0.35, 0.9 + rng() * 0.25, 0.9 + rng() * 0.35);
  g.rotation.y = rng() * TAU;
  return g;
}

function randomMoundPoint(rng, maxR = 5.0, minLift = 0.18, cx = -0.2, cz = -1.5, aspect = 0.88) {
  for (let tries = 0; tries < 80; tries++) {
    const a = rng() * TAU;
    const r = Math.sqrt(rng()) * maxR;
    const x = cx + Math.cos(a) * r * 1.04;
    const z = cz + Math.sin(a) * r * aspect;
    if (moundLift(x, z) > minLift) return { x, z };
  }
  return { x: cx, z: cz };
}

function onGround(rng, x, z, obj, sink = 0.05) {
  obj.position.set(x, heightAt(x, z) - sink, z);
  return obj;
}

function placeTrashOnMound(obj, x, z, rng, sink = 0.06) {
  const y = heightAt(x, z) - sink;
  obj.position.set(x, y, z);
  const n = surfaceNormal(x, z, 0.3);
  const tiltQ = new THREE.Quaternion().setFromUnitVectors(UP, n);
  const yawQ = new THREE.Quaternion().setFromAxisAngle(UP, rng() * TAU);
  const blend = new THREE.Quaternion().slerp(tiltQ, 0.18 + rng() * 0.22);
  obj.quaternion.copy(yawQ).multiply(blend);
  return obj;
}

function createBarrel(rng, mat, open = false) {
  const g = new THREE.Group();
  const h = 1.12, rb = 0.48, rt = 0.5;
  const bodyGeo = new THREE.CylinderGeometry(rt, rb, h, 12, 3, open);
  jitterGeometry(bodyGeo, (x, y, z) => {
    const a = Math.atan2(z, x);
    const dent = 1 + 0.035 * Math.sin(a * 3 + 1.2) + 0.025 * Math.cos(y * 6 + a * 2);
    return { x: x * dent, y, z: z * dent };
  });
  const body = new THREE.Mesh(bodyGeo, mat);
  body.position.y = h / 2;
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);
  const bandMat = makeMat(0x5d4e3d, { roughness: 0.9, metalness: 0.2 });
  [0.15, 0.56, 0.97].forEach((y, i) => {
    const r1 = rb + (rt - rb) * (y / h);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(r1 + 0.025, r1 + 0.025, i === 1 ? 0.055 : 0.075, 12, 1, true), bandMat);
    band.position.y = y;
    band.castShadow = true;
    g.add(band);
  });
  if (open) {
    const dark = new THREE.Mesh(new THREE.CircleGeometry(rt - 0.05, 12), M.darkInteriorDouble);
    dark.rotation.x = -Math.PI / 2;
    dark.position.y = h - 0.08;
    g.add(dark);
  } else {
    const lid = new THREE.Mesh(new THREE.CylinderGeometry(rt, rt, 0.045, 12), bandMat);
    lid.position.y = h + 0.01;
    lid.castShadow = true;
    g.add(lid);
    box(g, 0.2, 0.05, 0.12, M.rustDark, 0.16, h + 0.05, 0.1);
  }
  return g;
}

function bentPanelGeometry(w, h, t, bend, seed) {
  const g = new THREE.BoxGeometry(w, h, t, 8, 4, 1);
  jitterGeometry(g, (x, y, z) => {
    const nx = x / (w / 2);
    const ny = y / (h / 2);
    const zz = z + bend * (1 - nx * nx) + bend * 0.25 * Math.sin(ny * 2.4 + seed);
    const yy = y + 0.035 * Math.sin(nx * 3.0 + seed) * (1 - Math.abs(ny));
    return { x: x + 0.02 * Math.sin(ny * 3 + seed), y: yy, z: zz };
  });
  return g;
}

function addScrapPanel(parent, x, z, w, h, rotY, tilt, seed, mat) {
  const geo = bentPanelGeometry(w, h, 0.05, 0.14, seed);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, heightAt(x, z) + h * 0.45 - 0.06, z);
  mesh.rotation.set(tilt, rotY, (seed % 0.2) - 0.1);
  mesh.castShadow = true; mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function createBasket() {
  const g = new THREE.Group();
  const w = 0.78, d = 0.55, h = 0.34;
  const barMat = M.steelLight;
  const bar = (bw, bh, bd, x, y, z, rx = 0, ry = 0, rz = 0) => box(g, bw, bh, bd, barMat, x, y, z, rx, ry, rz);
  // base
  bar(w, 0.035, 0.035, 0, 0, -d / 2);
  bar(w, 0.035, 0.035, 0, 0, d / 2);
  for (let i = 1; i < 5; i++) bar(0.03, 0.03, d, -w / 2 + (i / 5) * w, 0, 0);
  // sides
  for (const sx of [-1, 1]) {
    for (let i = 0; i < 4; i++) {
      bar(0.025, h, 0.025, sx * w / 2, h / 2, -d / 2 + (i / 3) * d, 0, 0, sx * 0.12);
    }
    bar(0.03, 0.03, d, sx * w / 2, h, 0, 0, 0, sx * 0.12);
  }
  for (const sz of [-1, 1]) {
    for (let i = 0; i < 5; i++) bar(0.025, h, 0.025, -w / 2 + (i / 4) * w, h / 2, sz * d / 2, 0, 0, 0);
    bar(w, 0.03, 0.03, 0, h, sz * d / 2);
  }
  // handle
  bar(0.72, 0.035, 0.035, 0, h + 0.14, -d / 2 - 0.02);
  bar(0.035, 0.15, 0.035, -w / 2, h + 0.06, -d / 2 - 0.02);
  bar(0.035, 0.15, 0.035, w / 2, h + 0.06, -d / 2 - 0.02);
  g.rotation.set(Math.PI, 0.4, 0.08);
  return g;
}

function fillSmallPile(cx, cz, radius, seed, bagCount, boxCount) {
  const rng = mulberry32(seed);
  for (let i = 0; i < bagCount; i++) {
    const a = rng() * TAU;
    const r = Math.sqrt(rng()) * radius;
    const x = cx + Math.cos(a) * r;
    const z = cz + Math.sin(a) * r * 0.82;
    const bag = createBag(rng, 0.48 + rng() * 0.45);
    placeTrashOnMound(bag, x, z, rng, 0.05);
    trashGroup.add(bag);
  }
  for (let i = 0; i < boxCount; i++) {
    const a = rng() * TAU;
    const r = Math.sqrt(rng()) * radius * 0.8;
    const x = cx + Math.cos(a) * r;
    const z = cz + Math.sin(a) * r;
    const b = createCardboardBox(rng, rng() > 0.5);
    placeTrashOnMound(b, x, z, rng, 0.03);
    trashGroup.add(b);
  }
}

function createFridge() {
  const g = new THREE.Group();
  const W = 1.5, H = 2.2, D = 1.0, t = 0.09;
  // shell
  box(g, W, H, t, M.cream, 0, H / 2, -D / 2 + t / 2);
  box(g, t, H, D, M.cream, -W / 2 + t / 2, H / 2, 0);
  box(g, t, H, D, M.cream, W / 2 - t / 2, H / 2, 0);
  box(g, W, t, D, M.cream, 0, H - t / 2, 0);
  box(g, W, t, D, M.cream, 0, t / 2, 0);

  // dark interior (inverted box)
  const inner = new THREE.Mesh(new THREE.BoxGeometry(W - 0.18, H - 0.26, D - 0.14), M.darkInterior);
  inner.position.set(0, H / 2, 0);
  g.add(inner);

  // shelves
  const shelfMat = makeMat(0xb7ad94, { roughness: 0.8 });
  [0.72, 1.35].forEach((y, i) => {
    box(g, W - 0.22, 0.035, D - 0.24, shelfMat, 0, y, 0.025);
    box(g, W - 0.22, 0.075, 0.03, shelfMat, 0, y + 0.04, D / 2 - 0.16 - i * 0.02);
  });

function createDumpster() {
  const g = new THREE.Group();
  const W = 2.9, D = 1.9, bodyB = 0.36, bodyT = 2.08, taper = 0.16;
  const bw = W * (1 - taper), bd = D * (1 - taper);

  const verts = [
    // bottom (y bodyB)
    [-bw / 2, bodyB, -bd / 2], [bw / 2, bodyB, -bd / 2], [bw / 2, bodyB, bd / 2], [-bw / 2, bodyB, bd / 2],
    // top
    [-W / 2, bodyT, -D / 2], [W / 2, bodyT, -D / 2], [W / 2, bodyT, D / 2], [-W / 2, bodyT, D / 2],
  ];
  const faces = [
    [0, 1, 2], [0, 2, 3],          // bottom
    [4, 6, 5], [4, 7, 6],          // top (dark floor?)
    [0, 1, 5], [0, 5, 4],          // back
    [3, 7, 6], [3, 6, 2],          // front
    [0, 4, 7], [0, 7, 3],          // left
    [1, 2, 6], [1, 6, 5],          // right
  ];
  const pos = [];
  for (const f of faces) for (const i of f) pos.push(...verts[i]);
  const bodyGeo = new THREE.BufferGeometry();
  bodyGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  bodyGeo.computeVertexNormals();
  const bodyMat = makeMat(0x697065, { roughness: 0.8, metalness: 0.32 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);

  // dark interior
  const inner = new THREE.Mesh(new THREE.BoxGeometry(W - 0.28, 1.5, D - 0.28), M.darkInterior);
  inner.position.set(0, 1.3, 0);
  g.add(inner);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W - 0.3, D - 0.3), makeMat(0x24231e));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = bodyB + 0.08;
  g.add(floor);

  // rim
  const rimMat = makeMat(0x565847, { roughness: 0.85, metalness: 0.3 });
  box(g, W + 0.1, 0.11, 0.13, rimMat, 0, bodyT, -D / 2);
  box(g, W + 0.1, 0.11, 0.13, rimMat, 0, bodyT, D / 2);
  box(g, 0.13, 0.11, D, rimMat, -W / 2, bodyT, 0);
  box(g, 0.13, 0.11, D, rimMat, W / 2, bodyT, 0);

  // reinforced corners
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const corner = box(g, 0.13, bodyT - bodyB, 0.13, rimMat,
      sx * (bw / 2 - 0.05) * 0.92, (bodyT + bodyB) / 2, sz * (bd / 2 - 0.05) * 0.92);
    corner.rotation.z = -sx * 0.045;
    corner.rotation.x = sz * 0.03;
  }

  // horizontal reinforcement bands
  for (const y of [0.8, 1.55]) {
    box(g, W + 0.04, 0.09, 0.07, rimMat, 0, y, -D / 2 + 0.02);
    box(g, W + 0.04, 0.09, 0.07, rimMat, 0, y, D / 2 - 0.02);
    box(g, 0.07, 0.09, D, rimMat, -W / 2 + 0.02, y, 0);
    box(g, 0.07, 0.09, D, rimMat, W / 2 - 0.02, y, 0);
  }

  // rust patches
  const rustPatches = [
    [0.7, 0.9, D / 2 + 0.005, 0.5, 0.35], [-0.9, 1.45, D / 2 + 0.005, 0.35, 0.24],
    [0.3, 0.65, -D / 2 - 0.005, 0.6, 0.3], [W / 2 + 0.005, 1.2, 0.2, 0.4, 0.5],
  ];
  rustPatches.forEach(([x, y, z, w, h], i) => {
    const axis = Math.abs(z) > D / 2 - 0.1 ? 'z' : 'x';
    if (axis === 'z') box(g, w, h, 0.012, i % 2 ? M.rust : M.rustDark, x, y, z);
    else box(g, 0.012, h, w, M.rust, z, y, x);
  });

  // rear access door outline and latch
  box(g, 1.22, 1.08, 0.018, rimMat, 0, 1.24, -D / 2 - 0.012);
  box(g, 0.035, 1.04, 0.022, M.rustDark, 0.38, 1.24, -D / 2 - 0.022);
  box(g, 0.16, 0.05, 0.035, M.steelLight, -0.42, 1.2, -D / 2 - 0.035);
  box(g, 0.03, 0.22, 0.025, M.rustDark, 0.5, 0.55, D / 2 + 0.006);
  box(g, 0.22, 0.03, 0.025, M.rust, -0.7, 1.78, -D / 2 - 0.006);

  // wheels
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const wheel = cyl(g, 0.23, 0.23, 0.17, 10, M.rubber, sx * 1.17, 0.23, sz * 0.72, 0, 0, Math.PI / 2);
    const hub = cyl(g, 0.1, 0.1, 0.185, 8, M.steelDark, sx * 1.17, 0.23, sz * 0.72, 0, 0, Math.PI / 2);
  }

  // hinged lid, partly open
  const lidGroup = new THREE.Group();
  lidGroup.position.set(0, bodyT + 0.08, -D / 2);
  const lid = box(lidGroup, W + 0.1, 0.1, D + 0.1, makeMat(0x72786a, { roughness: 0.82, metalness: 0.28 }),
    0, 0, D / 2);
  for (let i = -1; i <= 1; i++) {
    box(lidGroup, W - 0.1, 0.035, 0.07, rimMat, 0, 0.07, D / 2 + i * 0.55);
  }
  box(lidGroup, 0.35, 0.012, 0.45, M.rust, 0.7, 0.055, D * 0.72, 0, 0.3, 0);
  box(lidGroup, 0.22, 0.012, 0.3, M.rustDark, -0.8, 0.055, D * 0.32, 0, -0.2, 0);
  lidGroup.rotation.x = -0.55;
  g.add(lidGroup);

  // bags inside
  const rng = mulberry32(3311);
  for (let i = 0; i < 4; i++) {
    const bag = createBag(rng, 0.42 + rng() * 0.18, i % 2 ? 'charcoal' : 'olive');
    bag.position.set(-0.7 + i * 0.45, bodyT - 0.36 + rng() * 0.12, -0.2 + (rng() - 0.5) * 0.7);
    bag.rotation.z = (rng() - 0.5) * 0.4;
    g.add(bag);
  }
  return g;
}

function createCrate() {
  const g = new THREE.Group();
  const w = 0.85, h = 0.45, d = 0.65;

  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    box(g, 0.06, h, 0.06, mat, sx * w / 2, h / 2, sz * d / 2);
  }
  // horizontal bars
  for (const y of [0.1, 0.25, 0.42]) {
    box(g, w, 0.045, 0.05, mat, 0, y, -d / 2);
    box(g, w, 0.045, 0.05, mat, 0, y, d / 2);
    box(g, 0.05, 0.045, d, mat, -w / 2, y, 0);
    box(g, 0.05, 0.045, d, mat, w / 2, y, 0);
  }
  // vertical slats on long sides
  for (let i = 1; i < 5; i++) {
    box(g, 0.045, h * 0.78, 0.04, mat, -w / 2 + (i / 5) * w, h * 0.32, -d / 2);
    box(g, 0.045, h * 0.78, 0.04, mat, -w / 2 + (i / 5) * w, h * 0.32, d / 2);
  }
  // base
  box(g, w, 0.06, d, mat, 0, 0.03, 0);
  return g;
}

(function rocks() {
  const rng = mulberry32(454);
  for (let i = 0; i < 22; i++) {
    const a = rng() * TAU;
    const t = 0.76 + rng() * 0.18;
    const rf = outline(a);
    const x = Math.cos(a) * RX * rf * t;
    const z = Math.sin(a) * RZ * rf * t;
    const s = 0.16 + rng() * 0.42;
    const geo = new THREE.DodecahedronGeometry(s, 0);
    jitterGeometry(geo, (vx, vy, vz) => ({
      x: vx * (0.85 + rng() * 0.3), y: vy * (0.55 + rng() * 0.35), z: vz * (0.85 + rng() * 0.3)
    }));
    const rock = new THREE.Mesh(geo, rockMats[i % rockMats.length]);
    rock.position.set(x, heightAt(x, z) - s * 0.22, z);
    rock.rotation.set(rng() * TAU, rng() * TAU, rng() * TAU);
    rock.castShadow = true; rock.receiveShadow = true;
    world.add(rock);
  }

  // angular rocks along the path
  for (let i = 0; i < 8; i++) {
    const t = 0.1 + rng() * 0.8;
    const p = pathCurve.getPointAt(t);
    const tangent = pathCurve.getTangentAt(t);
    const side = new THREE.Vector3(-tangent.z, 0, tangent.x);
    const off = (rng() > 0.5 ? 1 : -1) * (1.45 + rng() * 0.6);
    const x = p.x + side.x * off;
    const z = p.z + side.z * off;
    const s = 0.1 + rng() * 0.2;
    const geo = new THREE.DodecahedronGeometry(s, 0);
    jitterGeometry(geo, (vx, vy, vz) => ({ x: vx, y: vy * 0.7, z: vz * (0.8 + rng() * 0.4) }));
    const rock = new THREE.Mesh(geo, rockMats[(i + 1) % rockMats.length]);
    rock.position.set(x, heightAt(x, z) - 0.04, z);

(function fence() {
  const postPoints = [
    [2.2, -7.1], [3.35, -7.28], [4.55, -7.4], [5.8, -7.45], [7.05, -7.35], [8.25, -7.2],
  ];
  const rng = mulberry32(556);
  const postMat = makeMat(0x6d6a5a, { roughness: 0.8, metalness: 0.4 });
  const postData = postPoints.map(([x, z], i) => {
    const h = 2.15 + rng() * 0.55;
    const lean = (rng() - 0.5) * 0.13;
    const y = heightAt(x, z);
    const post = box(world, 0.1, h, 0.1, postMat, x, y + h / 2, z, lean, rng() * 0.3, (rng() - 0.5) * 0.13);
    const cap = box(world, 0.15, 0.06, 0.15, M.rustDark, x, y + h, z);
    return { x, z, h, y, lean };
  });

  const wireMats = [];
  const wireTransforms = [];
  const addWireMatrix = (pos, quat, scale) => {
    const m = new THREE.Matrix4().compose(pos, quat, scale);
    wireTransforms.push(m);
  };
  const qSpan = new THREE.Quaternion();
  const zAxis = new THREE.Vector3(0, 1, 0);

  function addSpan(a, b, sag, bent) {
    const dx = b.x - a.x, dz = b.z - a.z;
    const len = Math.hypot(dx, dz);
    const yaw = Math.atan2(dx, dz);
    qSpan.setFromAxisAngle(zAxis, yaw);
    const levels = [0.32, 0.62, 0.86, 0.99];
    for (const lv of levels) {
      const y1 = a.y + a.h * lv;
      const y2 = b.y + b.h * lv;
      const segs = bent ? 4 : 1;
      for (let s = 0; s < segs; s++) {
        const t0 = s / segs, t1 = (s + 1) / segs;
        const x0 = lerp(a.x, b.x, t0), z0 = lerp(a.z, b.z, t0);
        const x1 = lerp(a.x, b.x, t1), z1 = lerp(a.z, b.z, t1);
        const yA = lerp(y1, y2, t0) + (bent ? -Math.sin(t0 * Math.PI) * sag : 0);
        const yB = lerp(y1, y2, t1) + (bent ? -Math.sin(t1 * Math.PI) * sag : 0);
        const l = Math.hypot(x1 - x0, z1 - z0, yB - yA);
        const mid = new THREE.Vector3((x0 + x1) / 2, (yA + yB) / 2, (z0 + z1) / 2);
        const dir = new THREE.Vector3(x1 - x0, yB - yA, z1 - z0).normalize();
        const q = new THREE.Quaternion().setFromUnitVectors(
          new THREE.Vector3(1, 0, 0), dir
        );
        addWireMatrix(mid, q, new THREE.Vector3(l, 0.028, 0.028));
      }
    }
    // vertical wires
    const verts = 5;
    for (let i = 1; i <= verts; i++) {
      const t = i / (verts + 1);
      const x = lerp(a.x, b.x, t), z = lerp(a.z, b.z, t);
      const yBase = heightAt(x, z);
      const yTop = lerp(a.y + a.h * 0.99, b.y + b.h * 0.99, t) + (bent ? -Math.sin(t * Math.PI) * sag : 0);
      const h = yTop - yBase;
      const q = new THREE.Quaternion().setFromAxisAngle(zAxis, bent ? (rng() - 0.5) * 0.12 : 0);
      addWireMatrix(new THREE.Vector3(x, (yBase + yTop) / 2, z), q, new THREE.Vector3(0.024, h, 0.024));
    }
  }

  // one missing span (between 5.8 and 7.05), one bent span (between 3.35 and 4.55)
  addSpan(postData[0], postData[1], 0.06, false);
  addSpan(postData[1], postData[2], 0.34, true);
  addSpan(postData[2], postData[3], 0.05, false);
  // gap: no span 3 -> 4
  addSpan(postData[4], postData[5], 0.12, true);

  const wireMesh = new THREE.InstancedMesh(boxGeom(1, 0.028, 0.028), M.fence, wireTransforms.length);
  wireTransforms.forEach((m, i) => wireMesh.setMatrixAt(i, m));
  wireMesh.castShadow = true;
  wireMesh.receiveShadow = true;
  wireMesh.frustumCulled = false;
  world.add(wireMesh);

  // loose bent wires hanging from the gap
  const hanging = new THREE.CatmullRomCurve3([
    new THREE.Vector3(5.8, heightAt(5.8, -7.45) + 1.55, -7.45),
    new THREE.Vector3(6.1, heightAt(6.1, -7.45) + 1.2, -7.4),
    new THREE.Vector3(6.4, heightAt(6.4, -7.45) + 1.35, -7.35),
    new THREE.Vector3(6.75, heightAt(6.75, -7.45) + 0.9, -7.3),
  ]);
  const hang = new THREE.Mesh(new THREE.TubeGeometry(hanging, 10, 0.022, 4, false), M.fence);
  hang.castShadow = true;
  world.add(hang);

  // weeds at posts
  const weedRng = mulberry32(777);
  for (const p of postData) {
    if (weedRng() > 0.6) {
      const tuft = createGrassTuft(weedRng, 0.55 + weedRng() * 0.25, M.grassDry);
      tuft.position.set(p.x + (weedRng() - 0.5) * 0.5, heightAt(p.x, p.z), p.z + 0.35);
      world.add(tuft);
    }
  }
})();

function stadiumPoints(L, H, parts = 6) {
  const r = H / 2;
  const xs = L / 2 - r;
  const pts = [];
  pts.push([-xs, -r]);
  pts.push([xs, -r]);
  for (let i = 0; i <= parts; i++) {
    const a = -Math.PI / 2 + (i / parts) * Math.PI;
    pts.push([xs + Math.cos(a) * r, Math.sin(a) * r]);
  }
  pts.push([-xs, r]);
  for (let i = 0; i <= parts; i++) {
    const a = Math.PI / 2 + (i / parts) * Math.PI;
    pts.push([-xs + Math.cos(a) * r, Math.sin(a) * r]);
  }
  return pts;
}

function makeTrackGeometry() {
  const L = 3.3, H = 1.08, thick = 0.17;
  const outerPts = stadiumPoints(L, H, 7);
  const innerPts = stadiumPoints(L - thick * 2, H - thick * 2, 7).reverse();
  const shape = new THREE.Shape(outerPts.map(p => new THREE.Vector2(p[0], p[1])));
  const hole = new THREE.Path(innerPts.map(p => new THREE.Vector2(p[0], p[1])));
  shape.holes.push(hole);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.5, bevelEnabled: false, steps: 1, curveSegments: 1 });
  geo.rotateY(Math.PI / 2);
  geo.translate(-0.25, 0, 0);

  const parts = [geo];
  const addPlate = (z, y, rot = 0) => {
    const b = new THREE.BoxGeometry(0.55, 0.12, 0.32);
    b.rotateX(rot);
    b.translate(0, y, z);
    parts.push(b);
  };
  // top and bottom runs
  for (let i = -3; i <= 3; i++) {
    addPlate(i * 0.37, H / 2 + 0.035);
    addPlate(i * 0.37, -H / 2 - 0.035);
  }
  // rounded ends
  for (const end of [-1, 1]) {
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i / 4) * Math.PI;
      const z = end * (L / 2 - H / 2) + Math.cos(a) * (H / 2 + 0.02);
      const y = Math.sin(a) * (H / 2 + 0.02);
      addPlate(z, y, -a);
    }
  }
  return mergeGeometries(parts.map(g => g.index ? g.toNonIndexed() : g), false);
}
const trackGeom = makeTrackGeometry();

/*  Animation                                                          */
/* ------------------------------------------------------------------ */

const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  // grass sway
  for (const s of swayingGrass) {
    s.mesh.rotation.z = Math.sin(elapsed * 0.85 + s.phase) * s.amp;
    s.mesh.rotation.x = Math.cos(elapsed * 0.62 + s.phase * 1.3) * s.amp * 0.6;
  }

  // paper lifting and settling
  const cycle = elapsed % 12;
  let lift = 0;
  if (cycle < 4.6) {
    const t = cycle / 4.6;
    lift = Math.sin(t * Math.PI) ** 2;
  }
  paper.position.set(
    paperBase.x + lift * 0.22 + Math.sin(elapsed * 1.4) * 0.03 * lift,
    paperBase.y + lift * 0.34,
    paperBase.z + lift * 0.1
  );
  paper.rotation.x = -Math.PI / 2 + 0.12 + lift * 0.55;
  paper.rotation.z = 0.4 + Math.sin(elapsed * 1.7) * 0.16 * lift + lift * 0.6;
  paper.rotation.y = Math.sin(elapsed * 1.1) * 0.2 * lift;

  // puddle ripples
  ripples.forEach((r, i) => {
    const p = ((elapsed + r.offset) % 5.6) / 5.6;
    r.mesh.scale.setScalar(0.35 + p * 2.0);
    rippleMaterials[i].opacity = 0.24 * (1 - p) * (1 - p);
  });

  controls.update();
  renderer.render(scene, camera);
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
